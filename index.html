<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Saúde Personal">
<meta name="theme-color" content="#2E2C7A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de trabalho para iPad. Barra lateral fixa (≥900px) ou abas embaixo (celular); conteúdo em coluna de até 1100px. Modo aula e apresentação ocupam a tela toda. Marca Saúde com Personal: índigo + magenta, azul-céu de apoio. */
:root{
  --bg:#F4F4F9; --surface:#FFFFFF; --surface2:#ECEBF5; --fg:#1C1B3A; --muted:#65648A; --line:#DFDEEC;
  --indigo:#2E2C7A; --magenta:#C42B7C; --sky:#3A9FCB;
  --ok:#1E8E62; --warn:#B87400; --bad:#C93434; --okbg:#E3F4EC; --warnbg:#FBF0DC; --badbg:#FBE5E5; --infobg:#E6F2FA;
  --forca:#C42B7C; --resist:#3A9FCB;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-bg:#FFFFFF; --r-fg:#1C1B3A; --r-muted:#6B6A8C; --r-line:#E6E5F0; --r-soft:#F5F4FA;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121128; --surface:#1C1B38; --surface2:#26254A; --fg:#EDEDF7; --muted:#A3A2C4; --line:#2F2E55;
  --indigo:#9C9AF2; --magenta:#E45BA0; --sky:#6CC4E8;
  --ok:#4CC793; --warn:#E3A93A; --bad:#EE6B6B; --okbg:#173A2E; --warnbg:#3B2E12; --badbg:#3E1C22; --infobg:#18324A;
  --forca:#E45BA0; --resist:#6CC4E8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121128; --surface:#1C1B38; --surface2:#26254A; --fg:#EDEDF7; --muted:#A3A2C4; --line:#2F2E55;
  --indigo:#9C9AF2; --magenta:#E45BA0; --sky:#6CC4E8;
  --ok:#4CC793; --warn:#E3A93A; --bad:#EE6B6B; --okbg:#173A2E; --warnbg:#3B2E12; --badbg:#3E1C22; --infobg:#18324A;
  --forca:#E45BA0; --resist:#6CC4E8; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h2{font-size:22px} h3{font-size:18px}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}
/* shell */
.shell{display:flex;min-height:100%}
.side{display:none}
.main{flex:1;min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo-pill{background:#fff;border-radius:10px;padding:4px 8px;display:flex;align-items:center;flex:none}
.logo-pill img{height:28px;width:auto;display:block}
.top-title{flex:1;min-width:0}
.top-title h1{font-size:22px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-title small{color:var(--muted);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.content{max-width:1100px;margin:0 auto;padding:16px 16px 110px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{display:grid;grid-template-columns:repeat(6,1fr)}
.tab{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--magenta)}
@media (min-width:900px){
  .tabs{display:none}
  .side{display:flex;flex-direction:column;gap:4px;width:220px;flex:none;position:sticky;top:0;height:100vh;padding:16px 12px;border-right:1px solid var(--line);background:var(--surface)}
  .side .logo-pill{margin:0 4px 14px;padding:8px 10px;border:1px solid var(--line)}
  .side .logo-pill img{height:38px}
  .side .tab{flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;padding:11px 12px;border-radius:10px}
  .side .tab[aria-current="page"]{background:var(--surface2)}
  .top .logo-pill{display:none}
  .content{padding:20px 28px 60px}
  .top-in{padding:12px 28px}
}
/* comuns */
.stack{display:flex;flex-direction:column;gap:14px}
.stack.s8{gap:8px} .stack.s20{gap:20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.nowrap{flex-wrap:nowrap}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.card.tight{padding:12px}
.cols{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:900px){.cols.c2{grid-template-columns:1fr 1fr}.cols.c3{grid-template-columns:repeat(3,1fr)}.cols.c21{grid-template-columns:2fr 1fr}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;text-decoration:none}
.btn.primary{background:var(--magenta);border-color:var(--magenta);color:#fff}
.btn.indigo{background:var(--indigo);border-color:var(--indigo);color:var(--bg)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--magenta);padding-inline:8px}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{min-height:36px;padding:6px 11px;font-size:13.5px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;border:0;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)} .chip.warn{background:var(--warnbg);color:var(--warn)} .chip.bad{background:var(--badbg);color:var(--bad)} .chip.n{background:var(--surface2);color:var(--muted)} .chip.info{background:var(--infobg);color:var(--sky)}
.chip.forca{background:color-mix(in srgb,var(--forca) 15%,transparent);color:var(--forca)} .chip.resist{background:color-mix(in srgb,var(--resist) 16%,transparent);color:var(--resist)}
button.chip{cursor:pointer}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.banner{border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--warnbg)} .banner.warn b{color:var(--warn)}
.banner.bad{background:var(--badbg)} .banner.bad b{color:var(--bad)}
.banner.ok{background:var(--okbg)} .banner.ok b{color:var(--ok)}
.banner.info{background:var(--infobg)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.li{display:flex;gap:12px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer;color:inherit}
.li:last-child{border-bottom:0}
.li-main{flex:1;min-width:0}
.li-main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.li-main span{font-size:13px;color:var(--muted)}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:16px;background:var(--surface2);color:var(--indigo)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-size:16px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:var(--bg)}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 10px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.06)}
dl.meta{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:0;font-size:14px}
dl.meta dt{color:var(--muted)} dl.meta dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.1}
.kpi .v small{font-size:14px;font-weight:600;color:var(--muted)}
.kpi .d{font-size:12px;color:var(--muted)}
.kpi.big{padding:16px;display:flex;flex-direction:column;gap:4px}
.kpi.big .v{font-size:clamp(24px,3vw,32px);overflow-wrap:anywhere}
#eye .lbl{display:inline}
@media (max-width:600px){#eye .lbl{display:none}}
.kpi.big .v small{font-size:18px}
.dash-hero{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.hero-n{font-family:var(--f-display);font-size:56px;font-weight:700;line-height:1;color:var(--indigo)}
.hero-n small{font-size:22px;color:var(--muted);font-weight:600}
#eye[aria-pressed="true"]{background:var(--surface2)}
.chart{width:100%;height:auto;display:block}
/* formulários */
.fgroup{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:900px){.fgroup.g3{grid-template-columns:repeat(3,1fr)}.fgroup.g4{grid-template-columns:repeat(4,1fr)}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label,.flabel{font-size:13px;font-weight:600}
.inp{position:relative;display:flex;align-items:center}
.inp input,.field select,.field textarea,.field > input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px}
.inp input{padding-right:48px}
.inp .u{position:absolute;right:12px;font-size:13px;color:var(--muted);pointer-events:none}
.field .hint{font-size:12px;color:var(--muted)}
.field.err input{border-color:var(--bad)} .field .msg{font-size:12px;color:var(--bad)}
.field.warnf input{border-color:var(--warn)} .field.warnf .msg{color:var(--warn)}
textarea{resize:vertical;min-height:90px}
.tg{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.tg input{width:20px;height:20px;accent-color:var(--magenta);flex:none}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--magenta);border-color:var(--magenta);color:#fff}
.sticky-actions{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);padding-top:14px;display:flex;gap:10px;z-index:5}
@media (min-width:900px){.sticky-actions{bottom:0}}
.sticky-actions .btn{flex:1}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
/* agenda */
.week{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:900px){.week{grid-template-columns:repeat(6,minmax(0,1fr))}}
.day{display:flex;flex-direction:column;gap:8px;min-width:0}
.day-h{display:flex;justify-content:space-between;align-items:baseline;padding:2px 2px 0}
.day-h b{font-family:var(--f-display);font-size:18px}
.day-h.today b{color:var(--magenta)}
.sess{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:9px 10px;display:flex;flex-direction:column;gap:3px;text-align:left;cursor:pointer;width:100%;color:inherit}
.sess.forca{border-left-color:var(--forca)} .sess.resist{border-left-color:var(--resist)}
.sess.done{opacity:.72} .sess.off{opacity:.5;text-decoration:line-through}
.sess .t{font-size:12.5px;color:var(--muted);font-weight:600}
.sess .n{font-weight:700;font-size:14.5px;line-height:1.2}
.sess .s{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.empty-day{font-size:13px;color:var(--muted);padding:6px 2px}
.hbar{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.hbar > div{height:100%;background:var(--indigo)}
/* modal / toast */
.scrim{position:fixed;inset:0;background:rgba(10,10,30,.45);z-index:80;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:620px;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:18px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:120;max-width:calc(100% - 32px)}
/* tela cheia: modo aula + apresentação */
.fsx{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.fsx-in{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.aula-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.timer{font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.stim{border-radius:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.stim .big{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1}
.exo{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.exo-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exo-h b{font-size:17px}
.sets{display:flex;flex-wrap:wrap;gap:8px}
.set{border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--surface2);font-size:15px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px;font-weight:700;cursor:pointer}
.stepper .val{min-width:76px;border:0;background:none;cursor:pointer;color:inherit;text-align:center;font-family:var(--f-display);font-size:28px;font-weight:700}
.stepper .val small{font-size:13px;color:var(--muted);font-weight:600}
.pain-scale{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.pain-scale button{height:42px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.pain-scale button[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.photo-view{position:relative;border-radius:14px;overflow:hidden;background:#000}
.photo-view img{display:block;width:100%;height:auto}
.photo-view .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.45) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.45) 1px,transparent 1px);background-size:12.5% 12.5%;pointer-events:none}
.photo-view .vline{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#E45BA0;pointer-events:none}
/* apresentação (sempre clara, para o aluno) */
.pres{position:fixed;inset:0;z-index:70;background:#F7F6FC;color:#1C1B3A;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 20px calc(env(safe-area-inset-bottom,0px) + 20px)}
.pres-in{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:18px;min-height:100%}
.pres h2{font-size:clamp(28px,4vw,42px);color:#2E2C7A}
.pres .pcard{background:#fff;border-radius:18px;padding:20px;box-shadow:0 1px 3px rgba(30,30,80,.08)}
.pres .bigv{font-family:var(--f-display);font-size:clamp(40px,6vw,64px);font-weight:700;line-height:1;color:#2E2C7A}
.pres .lbl{font-size:13px;color:#6B6A8C;font-weight:600}
.pres .r-chart text{fill:#6B6A8C}
.pres-nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pres-nav button{border:0;background:#E7E6F3;color:#2E2C7A;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:15px}
.pres-nav button[aria-pressed="true"]{background:#2E2C7A;color:#fff}
.gain{display:grid;grid-template-columns:minmax(0,1.4fr) 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #ECEBF4}
.gain:last-child{border-bottom:0}
.gain .bar{height:12px;border-radius:6px;background:#ECEBF4;overflow:hidden}
.gain .bar div{height:100%;background:#C42B7C}
/* relatório de avaliação (folha clara) */
.rpt-wrap{display:flex;justify-content:center}
.rpt{width:100%;max-width:420px;background:var(--r-bg);color:var(--r-fg);border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(20,20,60,.12)}
.r-head{padding:18px 18px 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:1px solid var(--r-line)}
.r-head img{height:44px;width:auto}
.r-head .r-date{text-align:right;font-size:12px;color:var(--r-muted)}
.r-head .r-date b{display:block;font-family:var(--f-display);font-size:18px;color:#2E2C7A}
.r-band{background:#2E2C7A;color:#fff;padding:16px 18px}
.r-band h2{font-size:24px;line-height:1.1}
.r-band p{margin:4px 0 0;font-size:13px;opacity:.85}
.r-sec{padding:16px 18px;border-bottom:1px solid var(--r-line)}
.r-sec h3{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:#C42B7C;margin-bottom:10px;font-family:var(--f-body);font-weight:700}
.r-lead{font-size:15px;line-height:1.5;margin:0}
.r-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.r-k{background:var(--r-soft);border-radius:10px;padding:10px 11px;min-width:0}
.r-k .l{font-size:11.5px;color:var(--r-muted);font-weight:600}
.r-k .v{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.15;color:#1C1B3A}
.r-k .v small{font-size:13px;color:var(--r-muted);font-weight:600}
.r-k .dl{font-size:11.5px;color:var(--r-muted)}
.pill{display:inline-block;font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px;margin-top:3px;letter-spacing:.02em}
.p-ok{background:#E1F3EA;color:#17734F} .p-warn{background:#FBEFD8;color:#8F5A00} .p-bad{background:#FADFDF;color:#A82828} .p-good{background:#E2ECFA;color:#24539E} .p-n{background:#EEEDF5;color:#5B5A7A}
.r-bar{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:8px 0}
.r-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--r-muted)}
.r-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.r-tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.r-tbl th{font-size:11px;color:var(--r-muted);font-weight:600;text-align:right;padding:4px 4px 6px}
.r-tbl th:first-child{text-align:left}
.r-tbl td{padding:6px 4px;border-top:1px solid var(--r-line);text-align:right}
.r-tbl td:first-child{text-align:left}
.r-tbl .dlt{font-weight:700}
.r-note{font-size:12px;color:var(--r-muted);margin:8px 0 0}
.r-quote{font-size:15px;line-height:1.55;white-space:pre-wrap;margin:0;border-left:3px solid #C42B7C;padding-left:12px}
.r-foot{background:var(--r-soft);padding:12px 18px;font-size:11.5px;color:var(--r-muted);display:flex;justify-content:space-between;gap:8px}
.r-chart text{fill:#6B6A8C}
.tbl-wrap{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{font-size:12px;color:var(--muted);font-weight:600}
.note-txt{white-space:pre-wrap;font-size:14px}
.note-txt.clamp{max-height:16.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent)}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .16s ease-out}@keyframes fade{from{opacity:.5;transform:translateY(3px)}to{opacity:1;transform:none}}}
</style>

let dlCap=null; (async()=>{try{if(window.claude&&claude.use){dlCap=await claude.use('downloads');}}catch(e){}})();
async function deliver(blob,filename,mime,preferLink=false){
  if(!preferLink){ try{ const f=new File([blob],filename,{type:mime}); if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:filename}); return true; } }catch(e){ if(e&&e.name==='AbortError')return false; } }
  if(dlCap){ try{ await dlCap.save({filename,data:blob}); return true; }catch(e){ if(e&&e.code==='declined')return false; } }
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000); return true; }catch(e){ toast('Este navegador não permitiu salvar o arquivo.'); return false; }
}

function icsEvent({titulo,data,hora='08:00',duracaoMin=30,descricao=''}){
  const dt=(data.replace(/-/g,''))+'T'+hora.replace(':','')+'00';
  const end=new Date(data+'T'+hora+':00'); end.setMinutes(end.getMinutes()+duracaoMin);
  const p=n=>String(n).padStart(2,'0'); const de=`${end.getFullYear()}${p(end.getMonth()+1)}${p(end.getDate())}T${p(end.getHours())}${p(end.getMinutes())}00`;
  const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const escI=s=>String(s).replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Saude com Personal//Avaliacoes//PT','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:'+uid('ev')+'@saudecompersonal','DTSTAMP:'+stamp,'DTSTART:'+dt,'DTEND:'+de,'SUMMARY:'+escI(titulo),'DESCRIPTION:'+escI(descricao),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+escI(titulo),'TRIGGER:-PT0M','END:VALARM','BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+escI(titulo),'TRIGGER:-P1D','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
}

function band(tbl,sexo,idade,v){ if(v==null||!sexo||!tbl[sexo])return null; const a=idade??30; const cut=tbl[sexo].find(r=>a<=r[0])[1]; return v<cut[0]?0:v<cut[1]?1:v<cut[2]?2:3; }
function clsGordura(sexo,idade,v){const b=band(REF_G,sexo,idade,v);return b==null?null:[['Baixo','warn'],['Normal','ok'],['Alto','warn'],['Muito alto','bad']][b];}
function clsMusculo(sexo,idade,v){const b=band(REF_M,sexo,idade,v);return b==null?null:[['Baixo','warn'],['Normal','ok'],['Alto','good'],['Muito alto','good']][b];}
function clsVisceral(v){if(v==null)return null;return v<10?['Normal','ok']:v<15?['Alto','warn']:['Muito alto','bad'];}
function clsIMC(v){if(v==null)return null;return v<18.5?['Abaixo do peso','warn']:v<25?['Saudável','ok']:v<30?['Sobrepeso','warn']:v<35?['Obesidade I','bad']:v<40?['Obesidade II','bad']:['Obesidade III','bad'];}
function clsCintura(sexo,v){if(v==null||!sexo)return null;const [a,b]=sexo==='F'?[80,88]:[94,102];return v<a?['Adequada','ok']:v<b?['Risco aumentado','warn']:['Risco muito aumentado','bad'];}
function clsRCQ(sexo,v){if(v==null||!sexo)return null;return v<=(sexo==='F'?.85:.90)?['Adequada','ok']:['Risco aumentado','warn'];}
function clsRCE(v){if(v==null)return null;return v<.5?['Adequada','ok']:v<.6?['Risco aumentado','warn']:['Risco alto','bad'];}

function parseEsq(s){const m=String(s||'').match(/(\d+)\s*[x×]\s*(\d+)/i);return m?{series:+m[1],reps:+m[2]}:null;}
function semanaDe(al,iso){
  if(!al||!al.ciclo||!al.ciclo.inicio)return null;
  const idx=Math.floor(days(weekStart(al.ciclo.inicio),weekStart(iso))/7);
  if(idx<0)return null;
  const tipo=(idx%2===0)?al.ciclo.primeira:(al.ciclo.primeira==='forca'?'resist':'forca');
  const esq=tipo==='forca'?(al.plano?.forca||'4x8'):(al.plano?.resist||'3x12');
  return {tipo,esq,idx,label:tipo==='forca'?'Força':'Resistência'};
}
const e1rm=(carga,reps)=>(!carga||!reps||reps<1||reps>12)?null:carga/(1-0.02*reps);
const pctReps=reps=>Math.max(0.3,1-0.02*reps);
const arred=k=>k==null?null:(k<20?Math.round(k*2)/2:Math.round(k));
function forcaEstimada(alunoId,exNome){
  const n=normTxt(exNome); let best=null;
  D.testes.filter(t=>t.alunoId===alunoId).forEach(t=>{const c=D.catalogoTestes.find(x=>x.id===t.testeId);if(c&&c.tipo==='rm'&&normTxt(c.nome)===n){const v=e1rm(t.carga,t.reps)??t.valor;if(v&&(!best||t.data>best.data||(t.data===best.data&&v>best.v)))best={v,data:t.data,fonte:'teste'};}});
  D.aulas.filter(a=>a.status==='realizada'&&a.por&&a.por[alunoId]).forEach(a=>{(a.por[alunoId].exs||[]).forEach(x=>{if(normTxt(x.nome)!==n)return;let m=null;(x.series||[]).forEach(s=>{const v=e1rm(s.carga,s.reps);if(v&&(!m||v>m))m=v;});if(m&&(!best||a.data>best.data||(a.data===best.data&&m>best.v)))best={v:m,data:a.data,fonte:'aula'};});});
  return best;
}
function ultimaVez(alunoId,exNome,antesDe){
  const n=normTxt(exNome); let r=null;
  D.aulas.filter(a=>a.status==='realizada'&&a.por&&a.por[alunoId]&&(!antesDe||a.data<antesDe)).sort((a,b)=>a.data<b.data?1:-1).some(a=>{const x=(a.por[alunoId].exs||[]).find(e=>normTxt(e.nome)===n&&e.series&&e.series.length);if(x){r={data:a.data,series:x.series};return true;}return false;});
  return r;
}
function historicoForca(alunoId,exNome){
  const n=normTxt(exNome); const pts={};
  D.testes.filter(t=>t.alunoId===alunoId).forEach(t=>{const c=D.catalogoTestes.find(x=>x.id===t.testeId);if(c&&c.tipo==='rm'&&normTxt(c.nome)===n){const v=e1rm(t.carga,t.reps)??t.valor;if(v)pts[t.data]=Math.max(pts[t.data]||0,v);}});
  D.aulas.filter(a=>a.status==='realizada'&&a.por&&a.por[alunoId]).forEach(a=>{(a.por[alunoId].exs||[]).forEach(x=>{if(normTxt(x.nome)!==n)return;(x.series||[]).forEach(s=>{const v=e1rm(s.carga,s.reps);if(v)pts[a.data]=Math.max(pts[a.data]||0,v);});});});

function alvoAlunos(alvo){ if(alvo.tipo==='dupla'){const d=duplaById(alvo.id);return d?d.alunoIds:[];} return [alvo.id]; }
function alvoNome(alvo){ if(alvo.tipo==='dupla'){const d=duplaById(alvo.id);return d?d.nome:'Casal removido';} const a=alunoById(alvo.id);return a?a.nome:'Aluno removido'; }
function alvoCurto(alvo){ if(alvo.tipo==='dupla')return alvoNome(alvo); const a=alunoById(alvo.id); if(!a)return '?'; const p=a.nome.split(' '); return p.length>1?p[0]+' '+p[p.length-1][0]+'.':p[0]; }
function valorSessao(alvo){ if(alvo.tipo==='dupla'){return duplaById(alvo.id)?.valorSessao??null;} const a=alunoById(alvo.id); return a?(planoPersonal(a)?.valorSessao??null):null; }
const aulaIdDe=(slotId,data)=>'S_'+slotId+'_'+data;
function sessoesDoDia(iso){
  const wd=weekday(iso); const out=[];
  D.slots.filter(s=>s.ativo!==false&&s.dia===wd&&(!s.desde||s.desde<=iso)&&(!s.ate||s.ate>=iso)).forEach(s=>{
    const aula=D.aulas.find(a=>a.id===aulaIdDe(s.id,iso));
    out.push({key:aulaIdDe(s.id,iso),data:iso,hora:aula?.hora||s.hora,duracao:aula?.duracao||s.duracao||D.config.duracaoPadrao,local:aula?.local||s.local,alvo:s.alvo,slotId:s.id,aula});
  });
  D.aulas.filter(a=>a.data===iso&&!a.slotId).forEach(a=>out.push({key:a.id,data:iso,hora:a.hora,duracao:a.duracao,local:a.local,alvo:a.alvo,slotId:null,aula:a}));
  return out.sort((a,b)=>a.hora<b.hora?-1:1);
}
function garantirAula(ses){
  if(ses.aula)return ses.aula;
  const a={id:ses.key,data:ses.data,hora:ses.hora,duracao:ses.duracao,local:ses.local,slotId:ses.slotId,alvo:ses.alvo,alunoIds:alvoAlunos(ses.alvo),status:'agendada',prep:null,inicio:null,fim:null,por:{},recado:null,notas:null,fotos:[],cobrar:false,valor:null};
  D.aulas.push(a); ses.aula=a; return a;
}
function estadoSessao(ses){
  const a=ses.aula; const st=a?.status||'agendada';
  if(st==='realizada')return ['Realizada','ok'];
  if(st==='andamento')return ['Em andamento','info'];
  if(st==='falta')return [a.cobrar?'Falta (cobrada)':'Falta','bad'];
  if(st==='cancelada')return ['Cancelada','n'];
  if(st==='remarcada')return ['Remarcada','n'];
  if(a&&a.prep)return ['Preparada','ok'];
  return ['A preparar','warn'];
}
function ultimoRecado(alunoId,antesDe){
  return D.aulas.filter(a=>a.status==='realizada'&&a.alunoIds.includes(alunoId)&&a.data<=(antesDe||'9999')&&(a.recado||(a.por?.[alunoId]?.dores||[]).length)).sort((a,b)=>(a.data+a.hora)<(b.data+b.hora)?1:-1)[0]||null;
}

/* ================== ALERTAS ================== */
function alertas(){
  const t=today(); const out=[];
  D.alunos.filter(a=>a.status==='ativo').forEach(a=>{
    const avs=avsOf(a.id); const last=avs[avs.length-1];
    if(isPersonal(a)){
      const due=last?addDays(last.data,60):t; const dd=days(t,due);
      if(dd<=7)out.push({tipo:'avaliacao',alunoId:a.id,due,prio:dd<0?2:1,txt:last?(dd<0?`Avaliação vencida há ${-dd} dias (última em ${fdate(last.data)})`:`Avaliação vence ${dd===0?'hoje':'em '+dd+' dias'}`):'Sem avaliação registrada'});
    }
    if(a.objetivo&&a.objetivo.data){const rv=(a.objetivo.revisoes||[]).slice(-1)[0];const base=rv?rv.data:a.objetivo.data;const due=addDays(base,180);const dd=days(t,due);if(dd<=14)out.push({tipo:'objetivo',alunoId:a.id,due,prio:dd<0?2:1,txt:dd<0?'Revisão do objetivo atrasada':`Revisar objetivo ${dd===0?'hoje':'em '+dd+' dias'}`});}
    const po=planoOnline(a); if(po&&po.fim){const dd=days(t,po.fim);if(dd<=10)out.push({tipo:'plano',alunoId:a.id,due:po.fim,prio:dd<0?2:1,txt:dd<0?`Plano ${po.periodicidade||''} vencido em ${fdate(po.fim)}`:`Plano ${po.periodicidade||''} vence em ${dd} dias`});}
  });
  return out.sort((a,b)=>b.prio-a.prio||(a.due<b.due?-1:1));
}

/* ================== GRÁFICO SVG ================== */
function lineChart(series,{h=170,w=640,unit='',dec=1,light=false}={}){
  const pts=series.flatMap(s=>s.data.map(p=>p.y)).filter(v=>v!=null);
  const n=Math.max(...series.map(s=>s.data.length));
  if(pts.length<1||n<1) return `<p class="muted small">Sem dados suficientes para o gráfico.</p>`;
  let lo=Math.min(...pts),hi=Math.max(...pts); if(hi-lo<1){lo-=1;hi+=1;} const pad=(hi-lo)*.15; lo-=pad;hi+=pad;
  const L=44,R=14,T=14,B=26,iw=w-L-R,ih=h-T-B;
  const X=i=>L+(n===1?iw/2:i*iw/(n-1)), Y=v=>T+ih-(v-lo)/(hi-lo)*ih;
  const tc=light?'#6B6A8C':'var(--muted)', gc=light?'#ECEBF4':'var(--line)';
  let g=''; for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3;const y=Y(v);g+=`<line x1="${L}" x2="${w-R}" y1="${y}" y2="${y}" stroke="${gc}" stroke-width="1"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" fill="${tc}">${fmt(v,(hi-lo>20||dec===0)?0:1)}</text>`;}
  const dates=series[0].data.map(p=>p.x); const ticks=n<=1?[0]:n<=4?[...Array(n).keys()]:[0,Math.round((n-1)/2),n-1];
  ticks.forEach(i=>{g+=`<text x="${X(i)}" y="${h-6}" text-anchor="${i===0&&n>1?'start':i===n-1&&n>1?'end':'middle'}" font-size="11" fill="${tc}">${fdate(dates[i])}</text>`;});
  let s='';
  series.forEach(se=>{ const P=se.data.map((p,i)=>p.y==null?null:[X(i),Y(p.y)]); let d='',on=false; P.forEach(q=>{if(!q){on=false;return;} d+=(on?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1);on=true;});
    if(series.length===1){const v=P.filter(Boolean);if(v.length>1)s+=`<path d="M${v[0][0]} ${T+ih}L${v.map(q=>q.join(' ')).join('L')}L${v[v.length-1][0]} ${T+ih}Z" fill="${se.color}" fill-opacity=".10"/>`;}
    s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
    P.forEach((q,i)=>{if(q){const last=i===P.length-1||P.slice(i+1).every(z=>!z);s+=`<circle cx="${q[0]}" cy="${q[1]}" r="${last?4.5:2.6}" fill="${last?se.color:(light?'#fff':'var(--surface)')}" stroke="${se.color}" stroke-width="2"/>`; if(last)s+=`<text x="${Math.min(q[0],w-R-2)}" y="${q[1]-9}" text-anchor="end" font-size="12" font-weight="700" fill="${se.color}" style="fill:${se.color}">${fmt(se.data[i].y,dec)}${unit}</text>`;}});
  });
  return `<svg class="chart ${light?'r-chart':''}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Gráfico de evolução">${g}${s}</svg>`;
}
function barChart(items,{h=160,w=640,color='var(--indigo)',light=false,unit=''}={}){
  if(!items.length)return `<p class="muted small">Sem dados.</p>`;
  const max=Math.max(1,...items.map(i=>i.v)); const L=10,R=10,T=18,B=24,iw=w-L-R,ih=h-T-B; const bw=iw/items.length;
  const tc=light?'#6B6A8C':'var(--muted)';
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Gráfico de barras">${items.map((it,i)=>{const bh=it.v/max*ih;const x=L+i*bw+bw*.18;const y=T+ih-bh;return `<rect x="${x}" y="${y}" width="${bw*.64}" height="${Math.max(bh,1)}" rx="4" fill="${color}"/><text x="${x+bw*.32}" y="${y-5}" text-anchor="middle" font-size="12" font-weight="700" fill="${tc}">${it.v}${unit}</text><text x="${x+bw*.32}" y="${h-6}" text-anchor="middle" font-size="11" fill="${tc}">${esc(it.l)}</text>`;}).join('')}</svg>`;
}
function legend(items,light){return `<div class="${light?'r-legend':'row small muted'}" style="gap:6px 14px">${items.map(([c,l])=>`<span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:${c}"></i>${l}</span>`).join('')}</div>`;}

const TABS=[['painel','Painel'],['hoje','Hoje'],['semana','Semana'],['alunos','Alunos'],['financeiro','Financeiro'],['ajustes','Backup e ajustes']];
function buildTabs(){

let route={v:'painel'}; const hist=[];
function go(v,p={},replace=false){ if(!replace&&route.v!==v)hist.push(route); route=Object.assign({v},p); render(); window.scrollTo(0,0); }
function back(fallback='alunos'){ const r=hist.pop(); if(r){route=r;render();window.scrollTo(0,0);} else go(fallback,{},true); }

function updateChip(){
  document.querySelectorAll('#bkChipSide').forEach(c=>{
    const t=c.querySelector('.bkTxt');
    if(META.demo){c.className='chip warn';t.textContent='Dados de exemplo';return;}
    if(!META.lastBackup){c.className='chip bad';t.textContent='Sem backup';return;}

/* ================== CARTÃO DE SESSÃO ================== */
function sessCard(ses,big=false){
  const ids=alvoAlunos(ses.alvo); const al=alunoById(ids[0]); const sem=al?semanaDe(al,ses.data):null;
  const [st,stc]=estadoSessao(ses); const off=['cancelada','remarcada'].includes(ses.aula?.status);
  const rec=ids.map(id=>ultimoRecado(id,ses.data)).find(Boolean);
  return `<button class="sess ${sem?sem.tipo:''} ${ses.aula?.status==='realizada'?'done':''} ${off?'off':''}" data-ses="${ses.key}" data-date="${ses.data}">
    <span class="t num">${ses.hora} · ${esc(ses.local||'local a definir')}</span>
    <span class="n">${esc(big?alvoNome(ses.alvo):alvoCurto(ses.alvo))}</span>
    <span class="s"><span class="chip ${stc}">${st}</span>${sem?`<span class="chip ${sem.tipo}">${sem.label} ${esc(sem.esq)}</span>`:''}${ses.alvo.tipo==='dupla'?'<span class="chip n">Casal</span>':''}</span>
    ${big&&ses.aula?.prep?.foco?`<span class="small">Foco: ${esc(ses.aula.prep.foco)}</span>`:''}
    ${big&&rec&&ses.aula?.status!=='realizada'?`<span class="small" style="color:var(--warn)">Da última aula: ${esc(rec.recado||((rec.por[ids[0]]?.dores||[]).map(d=>'dor '+d.local+' '+d.nivel).join(', ')))}</span>`:''}
  </button>`;
}
function wireSess(root){
  root.querySelectorAll('[data-ses]').forEach(b=>b.onclick=()=>{const ses=sessoesDoDia(b.dataset.date).find(s=>s.key===b.dataset.ses);if(ses)sessSheet(ses);});
}
function sessSheet(ses){
  const ids=alvoAlunos(ses.alvo); const st=ses.aula?.status||'agendada';
  const linhas=ids.map(id=>{const a=alunoById(id);if(!a)return '';const sem=semanaDe(a,ses.data);const rec=ultimoRecado(id,ses.data);const dores=(a.saude?.dores||[]).filter(d=>d.ativa!==false);
    return `<div class="card tight stack s8"><div class="row between"><b>${esc(a.nome)}</b>${sem?`<span class="chip ${sem.tipo}">Semana de ${sem.label.toLowerCase()} · ${esc(sem.esq)}</span>`:'<span class="chip warn">Ciclo não definido</span>'}</div>
      ${a.plano?`<span class="small muted">${esc([a.plano.nivel,a.plano.estrategia,a.plano.divisao&&('Divisão '+a.plano.divisao)].filter(Boolean).join(' · '))}</span>`:'<span class="small" style="color:var(--warn)">Plano do ciclo ainda não definido</span>'}
      ${dores.length||a.saude?.restricoes?`<span class="small"><b style="color:var(--bad)">Cuidados:</b> ${esc([a.saude.restricoes,...dores.map(d=>d.local+(d.lado?' '+d.lado:''))].filter(Boolean).join(' · '))}</span>`:''}
      ${rec?`<span class="small"><b style="color:var(--warn)">Última aula (${fdate(rec.data)}):</b> ${esc(rec.recado||'')} ${(rec.por[id]?.dores||[]).map(d=>`dor em ${esc(d.local)} (${d.nivel}/10)`).join(', ')}</span>`:''}</div>`;}).join('');
  sheet(`<div class="stack">
    <div><div class="eyebrow">${fdayL(ses.data)} · ${ses.hora} · ${esc(ses.local||'')}</div><h2>${esc(alvoNome(ses.alvo))}</h2></div>
    ${linhas}
    ${ses.aula?.prep?`<div class="banner ok"><div><b>Preparada:</b> ${esc([ses.aula.prep.divisao&&'Treino '+ses.aula.prep.divisao,ses.aula.prep.foco].filter(Boolean).join(' · '))}</div></div>`:''}
    <div class="stack s8">
      ${st==='realizada'?`<button class="btn primary" data-a="ver">Ver aula realizada</button><button class="btn danger" data-a="excluir">Excluir registro desta aula</button>`:st==='andamento'?`<button class="btn primary" data-a="iniciar">Voltar para a aula</button>`:['falta','cancelada','remarcada'].includes(st)?`<button class="btn" data-a="desfazer">Desfazer (${st})</button>`:`<button class="btn primary" data-a="iniciar">Iniciar aula</button><button class="btn" data-a="preparar">${ses.aula?.prep?'Editar preparação':'Preparar estímulo'}</button>`}
      ${st==='agendada'?`<div class="row"><button class="btn grow" data-a="falta">Falta</button><button class="btn grow" data-a="remarcar">Remarcar</button><button class="btn grow" data-a="cancelar">Cancelar</button></div>`:''}
      ${ids.length===1?`<button class="btn ghost" data-a="ficha">Abrir ficha do aluno</button>`:''}
    </div></div>`,(el,close)=>{
    el.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{
      const a=b.dataset.a;
      if(a==='iniciar'){close();const au=garantirAula(ses);if(au.status!=='andamento'){au.status='andamento';au.inicio=au.inicio||new Date().toISOString();au.alunoIds=alvoAlunos(ses.alvo);await saveAll();}openAula(au.id);}
      if(a==='ver'){close();openAula(ses.aula.id);}
      if(a==='preparar'){close();prepSheet(ses);}
      if(a==='ficha'){close();go('aluno',{id:ids[0],tab:'resumo'});}
      if(a==='falta'){close();faltaSheet(ses);}
      if(a==='cancelar'){const au=garantirAula(ses);au.status='cancelada';await saveAll();close();toast('Aula cancelada');render();}
      if(a==='desfazer'){const au=ses.aula;if(au.status==='remarcada'&&au.remarcadaPara){D.aulas=D.aulas.filter(x=>x.id!==au.remarcadaPara||x.status!=='agendada');au.remarcadaPara=null;}au.status='agendada';au.cobrar=false;await saveAll();close();render();}
      if(a==='remarcar'){close();remarcarSheet(ses);}
      if(a==='excluir'){close();if(await confirmSheet({title:'Excluir registro da aula?',body:'Os exercícios, dores e recado desta aula saem do histórico e do financeiro. Uma cópia local é guardada antes.',ok:'Excluir',danger:true})){await snapshot('antes de excluir aula');D.aulas=D.aulas.filter(x=>x.id!==ses.aula.id);await saveAll();toast('Registro excluído');render();}}
    });
  });
}
function prepSheet(ses){
  const ids=alvoAlunos(ses.alvo); const a=alunoById(ids[0]); const div=(a?.plano?.divisao||'ABC').split('');
  const p=ses.aula?.prep||{};

    <div class="field"><span class="flabel">Treino do dia</span><div class="opts" id="pdiv">${div.map(l=>`<button type="button" class="opt" data-v="${l}" aria-pressed="${p.divisao===l}">Treino ${l}</button>`).join('')}</div></div>
    <div class="field"><label for="p-foco">Foco e o que se espera</label><textarea id="p-foco" placeholder="Ex.: pernas com foco em glúteo, progredir carga no leg press, mobilidade de quadril no aquecimento">${esc(p.foco||'')}</textarea></div>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-x>Cancelar</button><button class="btn primary">Salvar preparação</button></div></form>`,(el,close)=>{

function faltaSheet(ses){

function alvosAgendaveis(){
  const a=D.alunos.filter(isPersonal).sort((x,y)=>x.nome.localeCompare(y.nome)).map(x=>({v:'A:'+x.id,l:x.nome}));

  return [...a,...d,...outros];

function slotSheet(slot){
  const opts=alvosAgendaveis(); const cur=slot?(slot.alvo.tipo==='dupla'?'D:':'A:')+slot.alvo.id:'';
  sheet(`<form class="stack" id="sf"><h2>${slot?'Editar horário fixo':'Novo horário fixo'}</h2>
    <div class="field"><label for="s-alvo">Aluno ou casal</label><select id="s-alvo">${opts.map(o=>`<option value="${o.v}" ${o.v===cur?'selected':''}>${esc(o.l)}</option>`).join('')}</select></div>
    <div class="field"><span class="flabel">Dia da semana</span><div class="opts" id="s-dias">${[1,2,3,4,5,6,0].map(d=>`<button type="button" class="opt" data-d="${d}" aria-pressed="${slot?slot.dia===d:false}">${DIAS[d]}</button>`).join('')}</div>${slot?'':'<span class="hint">Pode marcar mais de um dia: cria um horário para cada.</span>'}</div>
    <div class="fgroup"><div class="field"><label for="s-h">Horário</label><input id="s-h" type="time" value="${slot?.hora||'07:00'}" required></div>
      <div class="field"><label for="s-dur">Duração</label><div class="inp"><input id="s-dur" inputmode="numeric" value="${slot?.duracao||D.config.duracaoPadrao}"><span class="u">min</span></div></div>
      <div class="field full"><label for="s-l">Local</label><input id="s-l" list="locais3" value="${esc(slot?.local||'')}" placeholder="Ex.: R4, Chamonix, casa do aluno"></div></div>
    <datalist id="locais3">${D.config.locais.map(l=>`<option value="${esc(l)}">`).join('')}</datalist>
    <div id="sErr"></div>
    <div class="row between">${slot?'<button type="button" class="btn danger" data-del>Remover horário</button>':'<span></span>'}<div class="row"><button type="button" class="btn" data-x>Cancelar</button><button class="btn primary">Salvar</button></div></div></form>`,(el,close)=>{
    const sel=new Set(slot?[slot.dia]:[]);
    el.querySelectorAll('#s-dias .opt').forEach(o=>o.onclick=()=>{const d=+o.dataset.d;if(slot){sel.clear();sel.add(d);}else{sel.has(d)?sel.delete(d):sel.add(d);}el.querySelectorAll('#s-dias .opt').forEach(x=>x.setAttribute('aria-pressed',sel.has(+x.dataset.d)));});
    el.querySelector('[data-x]').onclick=close;
    const del=el.querySelector('[data-del]'); if(del)del.onclick=async()=>{slot.ativo=false;slot.ate=addDays(today(),-1);await saveAll();close();toast('Horário removido');render();};
    el.querySelector('#sf').onsubmit=async e=>{e.preventDefault();
      if(!sel.size){el.querySelector('#sErr').innerHTML='<div class="banner bad"><div><b>Escolha o dia da semana.</b></div></div>';return;}
      const [t,id]=el.querySelector('#s-alvo').value.split(':'); const alvo={tipo:t==='D'?'dupla':'aluno',id};
      const hora=el.querySelector('#s-h').value, dur=parseInt(el.querySelector('#s-dur').value)||60, local=el.querySelector('#s-l').value.trim()||null;
      if(local&&!D.config.locais.includes(local))D.config.locais.push(local);
      if(slot){ const mudou=slot.dia!==[...sel][0]||slot.hora!==hora||alvoKey(slot.alvo)!==alvoKey(alvo);
        if(mudou&&D.aulas.some(a=>a.slotId===slot.id)){slot.ativo=false;slot.ate=addDays(today(),-1);D.slots.push({id:uid('H'),dia:[...sel][0],hora,duracao:dur,local,alvo,ativo:true,desde:today()});}
        else Object.assign(slot,{dia:[...sel][0],hora,duracao:dur,local,alvo}); }
      else sel.forEach(d=>D.slots.push({id:uid('H'),dia:d,hora,duracao:dur,local,alvo,ativo:true,desde:today()}));
      await saveAll(); close(); toast('Semana padrão atualizada'); render();};
  });
}

let filt={q:'',f:'ativos'};
function vAlunos(app){
  const ativos=D.alunos.filter(a=>a.status==='ativo');
  setTop('Alunos',`${ativos.filter(isPersonal).length} no personal · ${ativos.filter(a=>planoOnline(a)).length} na consultoria online`,`<button class="btn sm primary" id="novo">+ Aluno</button>`);
  const lastAv={}; D.avaliacoes.forEach(v=>{if(!lastAv[v.alunoId]||v.data>lastAv[v.alunoId])lastAv[v.alunoId]=v.data;});
  const lastAula={}; D.aulas.forEach(a=>{if(a.status==='realizada')a.alunoIds.forEach(id=>{if(!lastAula[id]||a.data>lastAula[id])lastAula[id]=a.data;});});
  const F=[['ativos','Ativos'],['personal','Personal'],['online','Consultoria online'],['negociacao','Em negociação'],['inativos','Inativos'],['pend','Cadastro incompleto'],['todos','Todos']];
  app.innerHTML=`<div class="stack fade">
    <input class="search" id="q" type="search" placeholder="Buscar aluno" value="${esc(filt.q)}" autocomplete="off" aria-label="Buscar aluno">
    <div class="filters">${F.map(([k,l])=>`<button class="fchip" data-f="${k}" aria-pressed="${filt.f===k}">${l}</button>`).join('')}</div>
    <div class="list" id="lst"></div></div>`;
  const draw=()=>{const q=normTxt(filt.q.trim());
    let arr=D.alunos.filter(a=>!q||normTxt(a.nome).includes(q));
    const f=filt.f; if(!q||f!=='todos'){
      if(f==='ativos')arr=arr.filter(a=>a.status==='ativo'); if(f==='personal')arr=arr.filter(isPersonal); if(f==='online')arr=arr.filter(a=>a.status==='ativo'&&planoOnline(a));
      if(f==='negociacao')arr=arr.filter(a=>a.status==='negociacao'); if(f==='inativos')arr=arr.filter(a=>a.status==='inativo'); if(f==='pend')arr=arr.filter(a=>a.status==='ativo'&&pendencias(a).length);}
    arr.sort((a,b)=>a.nome.localeCompare(b.nome));
    $('#lst').innerHTML=arr.length?arr.slice(0,250).map(a=>{const sem=semanaDe(a,today());const tags=[isPersonal(a)?'<span class="chip info">Personal</span>':'',planoOnline(a)&&a.status==='ativo'?'<span class="chip n">Online</span>':'',a.status==='negociacao'?'<span class="chip warn">Negociação</span>':'',sem&&isPersonal(a)?`<span class="chip ${sem.tipo}">${sem.label}</span>`:'',a.status==='ativo'&&pendencias(a).length?'<span class="chip warn">Cadastro</span>':''].join('');
      const sub=[lastAula[a.id]&&'Última aula '+fdate(lastAula[a.id]),lastAv[a.id]&&'Avaliação '+fdate(lastAv[a.id])].filter(Boolean).join(' · ')||(a.status==='inativo'?'Inativo':'Sem histórico');
      return `<button class="li" data-al="${a.id}"><span class="av">${esc(initials(a.nome))}</span><span class="li-main"><b>${esc(a.nome)}</b><span>${sub}</span></span><span class="row" style="gap:4px;justify-content:flex-end">${tags}</span></button>`;}).join(''):`<div style="padding:18px" class="muted">Nenhum aluno encontrado.</div>`;
  };
  draw();
  $('#q').addEventListener('input',e=>{filt.q=e.target.value;draw();});
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filt.f=b.dataset.f;app.querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed',x===b));draw();});

  $('#novo').onclick=()=>go('cadastro',{});
}

function optsHtml(id,list,val,multi=false){const vs=multi?(val||[]):[val];return `<div class="opts" id="${id}">${list.map(o=>`<button type="button" class="opt" data-v="${esc(o)}" aria-pressed="${vs.includes(o)}">${esc(o)}</button>`).join('')}</div>`;}
function wireOpts(root,id,multi=false){const el=root.querySelector('#'+id);let val=multi?[...el.querySelectorAll('[aria-pressed="true"]')].map(b=>b.dataset.v):(el.querySelector('[aria-pressed="true"]')?.dataset.v||null);
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const v=b.dataset.v;if(multi){val=val.includes(v)?val.filter(x=>x!==v):[...val,v];}else{val=val===v?null:v;}el.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',multi?val.includes(x.dataset.v):x.dataset.v===val));});

function drawAula(){
  const a=D.aulas.find(x=>x.id===AULA.id); const aid=AULA.aid; const al=alunoById(aid); const p=por(a,aid);
  const sem=semanaDe(al,a.data); const esq=parseEsq(sem?.esq); const done=a.status==='realizada';
  const alvoReps=p.alvoReps||(esq?esq.reps:10);
  const dores=(al.saude?.dores||[]).filter(d=>d.ativa!==false);
  const cuid=[al.plano?.cuidados||al.saude?.restricoes,...dores.map(d=>d.local+(d.lado?' '+d.lado:''))].filter(Boolean);
  const rec=ultimoRecado(aid,addDays(a.data,-1)); const recOk=rec&&!(rec.id===a.id);
  const ov=$('#overlay');
  ov.innerHTML=`<div class="fsx" id="aulaFull"><div class="fsx-in">
    <div class="aula-top">
      <button class="btn" id="aSair">‹ ${done?'Fechar':'Sair'}</button>
      <div class="grow"><div class="eyebrow">${done?'Aula realizada':'Aula em andamento'} · ${fdate(a.data)} ${a.hora||''} · ${esc(a.local||'')}</div>
        ${a.alunoIds.length>1?`<div class="seg" style="margin-top:4px">${a.alunoIds.map(id=>`<button data-al="${id}" aria-pressed="${id===aid}">${esc(firstName(alunoById(id)?.nome))}</button>`).join('')}</div>`:`<h2>${esc(al.nome)}</h2>`}</div>
      <span class="timer" id="aTimer">--:--</span>
      ${done?'':'<button class="btn primary" id="aFim">Finalizar aula</button>'}
    </div>
    ${!p.checkin&&!done?`<div class="card stack s8" id="ck"><div class="row between"><h3>Como ${esc(firstName(al.nome))} está hoje?</h3><button class="btn sm" id="ckSem">Sem dor, tudo bem</button></div>
      <div class="row"><input id="ckLocal" placeholder="Onde dói? (ex.: joelho direito)" style="flex:1;min-width:180px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px"></div>
      <div class="pain-scale" id="ckEsc">${[...Array(11).keys()].map(i=>`<button data-v="${i}">${i}</button>`).join('')}</div>
      <div class="row"><span class="small muted">Disposição:</span>${['Baixa','Normal','Alta'].map((l,i)=>`<button class="opt" data-disp="${i+1}">${l}</button>`).join('')}<span class="grow"></span><button class="btn sm primary" id="ckOk">Registrar</button></div></div>`
      :p.checkin?`<div class="row small"><span class="chip ${p.checkin.dor?.length?'bad':'ok'}">${p.checkin.dor?.length?p.checkin.dor.map(d=>'Dor '+esc(d.local)+' '+d.nivel+'/10').join(', '):'Chegou sem dor'}</span>${p.checkin.disp?`<span class="chip n">Disposição ${['','baixa','normal','alta'][p.checkin.disp]}</span>`:''}</div>`:''}
    <div class="stim">
      ${sem?`<div><div class="eyebrow">Semana de ${sem.label.toLowerCase()}</div><div class="big" style="color:var(--${sem.tipo})">${esc(sem.esq.replace('x','×'))}</div></div>`:'<div><div class="eyebrow">Ciclo</div><div class="small" style="color:var(--warn)">Defina o ciclo na ficha</div></div>'}
      ${sem?.tipo==='resist'?`<div><div class="eyebrow">Repetições hoje</div><div class="opts" id="aReps">${[12,15,18].map(r=>`<button class="opt" data-r="${r}" aria-pressed="${alvoReps===r}">${r}</button>`).join('')}</div></div>`:''}
      <div class="grow small" style="min-width:200px">${a.prep?`<b>${a.prep.divisao?'Treino '+esc(a.prep.divisao)+' · ':''}</b>${esc(a.prep.foco||'')}`:al.plano?.foco?`<b>Foco do ciclo:</b> ${esc(al.plano.foco)}`:'<span class="muted">Sem preparação para hoje</span>'}
        ${al.plano?.treinos&&a.prep?.divisao?`<div class="muted">${esc((al.plano.treinos.split('\n').find(l=>l.trim().toUpperCase().startsWith(a.prep.divisao))||''))}</div>`:''}</div>
      ${cuid.length?`<div class="small" style="color:var(--bad);max-width:320px"><b>Cuidados:</b> ${esc(cuid.join(' · '))}</div>`:''}
    </div>
    ${recOk?`<div class="banner warn"><div><b>Da aula de ${fdate(rec.data)}:</b> ${esc(rec.recado||'')} ${(rec.por[aid]?.dores||[]).map(d=>`dor em ${esc(d.local)} (${d.nivel}/10)`).join(', ')}</div></div>`:''}
    <div class="stack s8" id="exs">${p.exs.map((x,i)=>exoCard(a,aid,x,i,alvoReps)).join('')||'<div class="card muted">Adicione os exercícios conforme a aula acontece.</div>'}</div>
    <div class="row"><button class="btn primary grow" id="addEx">+ Exercício</button><button class="btn grow" id="rest">Descanso</button><button class="btn grow" id="foto">Foto</button><button class="btn grow" id="dorBtn" style="color:var(--bad)">Registrar dor</button></div>
    <div id="restBox"></div><div id="fotoBox"></div>
    ${(p.dores||[]).length?`<div class="card stack s8"><div class="eyebrow" style="color:var(--bad)">Dores nesta aula</div>${p.dores.map((d,i)=>`<div class="row between small"><span>${esc(d.local)} · ${d.nivel}/10${d.exercicio?' · '+esc(d.exercicio):''} <span class="muted">${d.hora||''}</span></span><button class="btn sm ghost" data-rmdor="${i}">Remover</button></div>`).join('')}</div>`:''}
    ${(a.fotos||[]).length?`<div class="card stack s8"><div class="eyebrow">Fotos guardadas</div><div class="row">${a.fotos.map((f,i)=>`<img src="${f}" alt="Foto ${i+1}" style="height:90px;border-radius:8px" data-fv="${i}">`).join('')}</div></div>`:''}
    <div class="field"><label for="aNota">Anotações da aula</label><textarea id="aNota" placeholder="Pontos importantes, ajustes feitos, desempenho">${esc(a.notas||'')}</textarea></div>
    ${done?`<div class="field"><label for="aRec">Recado para a próxima aula</label><input id="aRec" value="${esc(a.recado||'')}" style="border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px"></div>`:''}
  </div></div>`;
  tickAula(); wireAula(a,aid,p);
}
function exoCard(a,aid,x,i,alvoReps){
  const f=forcaEstimada(aid,x.nome); const sug=f?arred(f.v*pctReps(alvoReps)):null; const last=ultimaVez(aid,x.nome,a.data);
  const ls=x.series[x.series.length-1]; const curC=x.cur?.carga??ls?.carga??(sug??last?.series?.slice(-1)[0]?.carga??null); const curR=x.cur?.reps??ls?.reps??alvoReps;
  x.cur={carga:curC,reps:curR};
  const step=v=>v==null?1:(v<30?1:2.5);
  return `<div class="exo" data-ex="${i}">
    <div class="exo-h"><div><b>${esc(x.nome)}</b><div class="tiny muted">${esc(x.grupo||'')}${last?` · última vez ${fdate(last.data)}: ${last.series.map(s=>(s.carga!=null?fmt(s.carga,s.carga%1?1:0)+'×':'')+(s.reps??'')).join(', ')}`:' · primeira vez no app'}${sug?` · <b style="color:var(--magenta)">sugerido ${fmt(sug,sug%1?1:0)} kg</b> p/ ${alvoReps} rep.`:''}</div></div>
      <button class="btn sm ghost" data-rmex="${i}" aria-label="Remover exercício">✕</button></div>
    ${x.series.length?`<div class="sets">${x.series.map((s,j)=>`<span class="set">${j+1}ª ${s.carga!=null?fmt(s.carga,s.carga%1?1:0)+' kg × ':''}${s.reps??'–'}</span>`).join('')}<button class="btn sm ghost" data-undo="${i}">Desfazer última</button></div>`:''}
    <div class="row" style="gap:16px">
      <div class="stepper"><button data-c="-${step(curC)}" data-i="${i}" aria-label="Menos carga">−</button><button class="val num" data-edc="${i}" aria-label="Digitar carga">${curC!=null?fmt(curC,curC%1?1:0):'–'}<small> kg</small></button><button data-c="${step(curC)}" data-i="${i}" aria-label="Mais carga">+</button></div>
      <div class="stepper"><button data-r="-1" data-i="${i}" aria-label="Menos repetições">−</button><button class="val num" data-edr="${i}" aria-label="Digitar repetições">${curR??'–'}<small> rep.</small></button><button data-r="1" data-i="${i}" aria-label="Mais repetições">+</button></div>
      <button class="btn indigo" data-addset="${i}">Registrar série</button>
      <button class="btn sm" data-semcarga="${i}">${curC==null?'Com carga':'Sem carga'}</button>
    </div></div>`;
}
function wireAula(a,aid,p){
  const ov=$('#overlay'); const save=()=>saveAll();
  ov.querySelector('#aSair').onclick=async()=>{a.notas=ov.querySelector('#aNota').value.trim()||null;const r=ov.querySelector('#aRec');if(r)a.recado=r.value.trim()||null;await save();closeOverlay();render();};
  ov.querySelectorAll('[data-al]').forEach(b=>b.onclick=()=>{a.notas=ov.querySelector('#aNota').value.trim()||null;AULA.aid=b.dataset.al;drawAula();});
  const fim=ov.querySelector('#aFim'); if(fim)fim.onclick=()=>{a.notas=ov.querySelector('#aNota').value.trim()||null;finalizarSheet(a);};
  // check-in
  const ck=ov.querySelector('#ck'); if(ck){let niv=null,disp=null;
    ck.querySelectorAll('#ckEsc button').forEach(b=>b.onclick=()=>{niv=+b.dataset.v;ck.querySelectorAll('#ckEsc button').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.v===niv));});
    ck.querySelectorAll('[data-disp]').forEach(b=>b.onclick=()=>{disp=+b.dataset.disp;ck.querySelectorAll('[data-disp]').forEach(x=>x.setAttribute('aria-pressed',x===b));});
    ck.querySelector('#ckSem').onclick=async()=>{p.checkin={dor:[],disp:disp||2};await save();drawAula();};
    ck.querySelector('#ckOk').onclick=async()=>{const loc=ck.querySelector('#ckLocal').value.trim();p.checkin={dor:loc&&niv!=null?[{local:loc,nivel:niv}]:[],disp};
      if(loc&&niv!=null){const s=alunoById(aid).saude;s.comoEsta={texto:`Dor em ${loc} (${niv}/10) no início da aula`,data:a.data};}
      await save();drawAula();};}
  ov.querySelectorAll('#aReps [data-r]').forEach(b=>b.onclick=async()=>{p.alvoReps=+b.dataset.r;p.exs.forEach(x=>{if(x.cur)x.cur.reps=null;});await save();drawAula();});
  // exercícios
  ov.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const x=p.exs[+b.dataset.i];const v=x.cur.carga==null?(parseFloat(b.dataset.c)>0?5:0):x.cur.carga+parseFloat(b.dataset.c);x.cur.carga=Math.max(0,Math.round(v*2)/2);drawAulaKeep();});
  ov.querySelectorAll('[data-r][data-i]').forEach(b=>{b.onclick=()=>{const x=p.exs[+b.dataset.i];x.cur.reps=Math.max(1,(x.cur.reps||0)+parseInt(b.dataset.r));drawAulaKeep();};});
  const numSheet=(titulo,atual,un,cb)=>sheet(`<form class="stack" id="nf"><h2>${titulo}</h2><div class="inp"><input id="nv" inputmode="decimal" value="${atual??''}" style="width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 48px 14px 14px;font-size:28px;font-family:var(--f-display);font-weight:700"><span class="u">${un}</span></div><div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-x>Cancelar</button><button class="btn primary">OK</button></div></form>`,(el,close)=>{const i=el.querySelector('#nv');setTimeout(()=>{i.focus();i.select();},50);el.querySelector('[data-x]').onclick=close;el.querySelector('#nf').onsubmit=e=>{e.preventDefault();const v=parseNum(i.value);close();cb(v==null||isNaN(v)?null:v);};});
  ov.querySelectorAll('[data-edc]').forEach(b=>b.onclick=()=>{const x=p.exs[+b.dataset.edc];numSheet('Carga',x.cur.carga,'kg',v=>{x.cur.carga=v==null?null:Math.max(0,Math.round(v*2)/2);drawAulaKeep();});});
  ov.querySelectorAll('[data-edr]').forEach(b=>b.onclick=()=>{const x=p.exs[+b.dataset.edr];numSheet('Repetições',x.cur.reps,'rep.',v=>{x.cur.reps=v==null?null:Math.max(1,Math.round(v));drawAulaKeep();});});
  ov.querySelectorAll('[data-semcarga]').forEach(b=>b.onclick=()=>{const x=p.exs[+b.dataset.semcarga];x.cur.carga=x.cur.carga==null?10:null;drawAulaKeep();});
  ov.querySelectorAll('[data-addset]').forEach(b=>b.onclick=async()=>{const x=p.exs[+b.dataset.addset];x.series.push({carga:x.cur.carga,reps:x.cur.reps,t:nowHM()});await save();drawAulaKeep();startRest(D.config.descansoPadrao||90);});
  ov.querySelectorAll('[data-undo]').forEach(b=>b.onclick=async()=>{p.exs[+b.dataset.undo].series.pop();await save();drawAulaKeep();});
  ov.querySelectorAll('[data-rmex]').forEach(b=>b.onclick=async()=>{const x=p.exs[+b.dataset.rmex];if(x.series.length&&!(await confirmSheet({title:'Remover exercício?',body:`${esc(x.nome)} tem ${x.series.length} série(s) registradas.`,ok:'Remover',danger:true})))return;p.exs.splice(+b.dataset.rmex,1);await save();drawAula();});
  ov.querySelectorAll('[data-rmdor]').forEach(b=>b.onclick=async()=>{p.dores.splice(+b.dataset.rmdor,1);await save();drawAula();});
  ov.querySelector('#addEx').onclick=()=>exPicker(async ex=>{p.exs.push({nome:ex.nome,grupo:ex.grupo,series:[]});await save();drawAula();setTimeout(()=>{const l=ov.querySelectorAll('.exo');l[l.length-1]?.scrollIntoView({block:'center',behavior:'smooth'});},50);});
  ov.querySelector('#rest').onclick=()=>restSheet();
  ov.querySelector('#dorBtn').onclick=()=>dorSheet(a,aid,p);
  ov.querySelector('#foto').onclick=()=>$('#photoIn').click();
  ov.querySelectorAll('[data-fv]').forEach(im=>im.onclick=()=>showFoto(a.fotos[+im.dataset.fv],a,+im.dataset.fv));
  drawRest();
}
function drawAulaKeep(){ const y=$('#aulaFull')?.scrollTop||0; const a=D.aulas.find(x=>x.id===AULA.id); const nota=$('#aNota')?.value; if(a&&nota!=null)a.notas=nota.trim()||null; drawAula(); const f=$('#aulaFull'); if(f)f.scrollTop=y; }
function startRest(sec){ AULA.restEnd=Date.now()+sec*1000; clearInterval(AULA.rest); AULA.rest=setInterval(drawRest,500); drawRest(); }
function drawRest(){ const box=$('#restBox'); if(!box)return; if(!AULA.restEnd){box.innerHTML='';return;} const s=Math.ceil((AULA.restEnd-Date.now())/1000);
  if(s<=0){box.innerHTML=`<div class="banner ok"><div><b>Descanso encerrado.</b></div></div>`;clearInterval(AULA.rest);AULA.restEnd=null;try{navigator.vibrate&&navigator.vibrate(300);}catch(e){}setTimeout(()=>{const b=$('#restBox');if(b&&!AULA.restEnd)b.innerHTML='';},3000);return;}
  box.innerHTML=`<div class="banner info" style="align-items:center"><span class="timer num">${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}</span><span class="grow">Descanso</span><button class="btn sm" id="rs15">+15 s</button><button class="btn sm" id="rsx">Parar</button></div>`;
  box.querySelector('#rs15').onclick=()=>{AULA.restEnd+=15000;drawRest();}; box.querySelector('#rsx').onclick=()=>{AULA.restEnd=null;clearInterval(AULA.rest);drawRest();}; }
function restSheet(){ sheet(`<div class="stack"><h2>Descanso</h2><div class="row">${[30,45,60,90,120,180].map(s=>`<button class="btn grow" data-s="${s}">${s<60?s+' s':(s/60)+' min'}</button>`).join('')}</div></div>`,(el,close)=>{el.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{D.config.descansoPadrao=+b.dataset.s;close();startRest(+b.dataset.s);});}); }
function exPicker(onPick){
  const grupos=[...new Set(D.exercicios.map(e=>e.grupo))];
  sheet(`<div class="stack"><h2>Adicionar exercício</h2><input class="search" id="exq" placeholder="Buscar ou digitar um novo" autocomplete="off">
    <div class="filters" id="exg"><button class="fchip" data-g="" aria-pressed="true">Todos</button>${grupos.map(g=>`<button class="fchip" data-g="${esc(g)}">${esc(g)}</button>`).join('')}</div>
    <div class="list" id="exl" style="max-height:46vh;overflow:auto"></div></div>`,(el,close)=>{
    let g=''; const draw=()=>{const q=normTxt(el.querySelector('#exq').value.trim());const l=D.exercicios.filter(e=>(!g||e.grupo===g)&&(!q||normTxt(e.nome).includes(q)));
      el.querySelector('#exl').innerHTML=l.slice(0,80).map(e=>`<button class="li" data-e="${e.id}"><span class="li-main"><b>${esc(e.nome)}</b><span>${esc(e.grupo)}</span></span></button>`).join('')+(q&&!l.some(e=>normTxt(e.nome)===q)?`<button class="li" id="exNovo"><span class="li-main"><b>+ Criar “${esc(el.querySelector('#exq').value.trim())}”</b><span>${g?esc(g):'escolha um grupo acima ou fica como Outros'}</span></span></button>`:'');
      el.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{close();onPick(D.exercicios.find(e=>e.id===b.dataset.e));});
      const nv=el.querySelector('#exNovo'); if(nv)nv.onclick=()=>{const ex={id:uid('E'),nome:el.querySelector('#exq').value.trim(),grupo:g||'Outros'};D.exercicios.push(ex);close();onPick(ex);};};
    el.querySelector('#exq').addEventListener('input',draw);
    el.querySelectorAll('#exg [data-g]').forEach(b=>b.onclick=()=>{g=b.dataset.g;el.querySelectorAll('#exg [data-g]').forEach(x=>x.setAttribute('aria-pressed',x===b));draw();});
    draw(); setTimeout(()=>el.querySelector('#exq').focus(),50);
  });
}
function dorSheet(a,aid,p){
  sheet(`<form class="stack" id="dorf"><h2>Registrar dor ou desconforto</h2>
    <div class="field"><label for="dl">Onde?</label><input id="dl" required placeholder="Ex.: lombar, joelho direito"></div>
    <div class="field"><span class="flabel">Intensidade (0 a 10)</span><div class="pain-scale" id="de">${[...Array(11).keys()].map(i=>`<button type="button" data-v="${i}">${i}</button>`).join('')}</div></div>
    <div class="field"><label for="dx">Em qual exercício?</label><select id="dx"><option value="">–</option>${p.exs.map(x=>`<option>${esc(x.nome)}</option>`).join('')}</select></div>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-x>Cancelar</button><button class="btn danger">Registrar</button></div></form>`,(el,close)=>{
    let n=null; el.querySelectorAll('#de button').forEach(b=>b.onclick=()=>{n=+b.dataset.v;el.querySelectorAll('#de button').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.v===n));});
    el.querySelector('[data-x]').onclick=close;
    el.querySelector('#dorf').onsubmit=async e=>{e.preventDefault();if(n==null){toast('Escolha a intensidade');return;}p.dores.push({local:el.querySelector('#dl').value.trim(),nivel:n,exercicio:el.querySelector('#dx').value||null,hora:nowHM()});await saveAll();close();drawAula();};
  });
}
function finalizarSheet(a){
  sheet(`<form class="stack" id="ff"><h2>Finalizar aula</h2>
    ${a.alunoIds.map(id=>`<div class="field"><span class="flabel">Esforço percebido · ${esc(firstName(alunoById(id)?.nome))} (0 a 10)</span><div class="pain-scale" data-pse="${id}">${[...Array(11).keys()].map(i=>`<button type="button" data-v="${i}" aria-pressed="${a.por?.[id]?.pse===i}">${i}</button>`).join('')}</div></div>`).join('')}
    <div class="field"><label for="fr">Recado para a próxima aula</label><input id="fr" value="${esc(a.recado||'')}" placeholder="Ex.: segurar a carga no agachamento; relatou dor 4 na lombar" style="border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px"></div>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-x>Voltar para a aula</button><button class="btn primary">Finalizar</button></div></form>`,(el,close)=>{
    el.querySelectorAll('[data-pse]').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{por(a,g.dataset.pse).pse=+b.dataset.v;g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));}));
    el.querySelector('[data-x]').onclick=close;
    el.querySelector('#ff').onsubmit=async e=>{e.preventDefault();a.recado=el.querySelector('#fr').value.trim()||null;a.status='realizada';a.fim=new Date().toISOString();if(!a.inicio)a.inicio=a.fim;a.valor=valorSessao(a.alvo);
      await saveAll();close();closeOverlay();toast('Aula finalizada e registrada');render();};
  });
}
$('#photoIn').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const url=await compressImage(f,1400,.82);const a=D.aulas.find(x=>x.id===AULA.id);if(a)showFoto(url,a,null);});
function compressImage(file,max,q){return new Promise(res=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q));URL.revokeObjectURL(img.src);};img.src=URL.createObjectURL(file);});}
function showFoto(url,a,idx){
  sheet(`<div class="stack"><div class="photo-view" id="pv"><img src="${url}" alt="Foto da execução"><div class="grid" id="pg"></div><div class="vline" id="pl"></div></div>
    <div class="row"><button class="btn sm" id="tg">Grade</button><button class="btn sm" id="tl">Linha central</button><span class="grow"></span>${idx==null?'<button class="btn" data-x>Descartar</button><button class="btn primary" id="keep">Guardar na aula</button>':'<button class="btn danger" id="del">Apagar</button><button class="btn" data-x>Fechar</button>'}</div></div>`,(el,close)=>{
    el.querySelector('#tg').onclick=()=>el.querySelector('#pg').hidden=!el.querySelector('#pg').hidden;
    el.querySelector('#tl').onclick=()=>el.querySelector('#pl').hidden=!el.querySelector('#pl').hidden;
    el.querySelector('[data-x]').onclick=close;
    const k=el.querySelector('#keep'); if(k)k.onclick=async()=>{a.fotos=a.fotos||[];a.fotos.push(url);await saveAll();close();drawAula();};
    const d=el.querySelector('#del'); if(d)d.onclick=async()=>{a.fotos.splice(idx,1);await saveAll();close();drawAula();};
  });
}

/* ================== APRESENTAÇÃO AO ALUNO ================== */
let PRES={id:null,tab:'corpo'};
function openApresentacao(id){PRES.id=id;document.body.style.overflow='hidden';drawPres();}
function drawPres(){
  const al=alunoById(PRES.id); const avs=avsOf(al.id).filter(v=>v.peso);
  const tabs=[['corpo','Corpo'],['forca','Força'],['testes','Testes'],['objetivo','Objetivo'],['constancia','Constância']];
  let body='';
  if(PRES.tab==='corpo'){
    if(avs.length<2)body=`<div class="pcard"><p class="lbl">Ainda não há duas avaliações para comparar.</p></div>`;
    else{const f=avs[0],u=avs[avs.length-1];const kg=(v,p)=>v.peso&&p!=null?v.peso*p/100:null;
      const gF=kg(f,f.gorduraPct),gU=kg(u,u.gorduraPct),mF=gF!=null?f.peso-gF:null,mU=gU!=null?u.peso-gU:null;
      const dP=u.peso-f.peso,dG=gU!=null&&gF!=null?gU-gF:null,dM=mU!=null&&mF!=null?mU-mF:null;
      const sig=v=>v==null?'–':(v>0?'+':'−')+fmt(Math.abs(v),1);
      const qual=dP<-0.5&&dG!=null&&dG>dP?Math.max(0,dG/dP*100):null; const maisGord=dP<-0.5&&dG!=null&&dG<=dP;
      body=`<div class="pcard"><div class="lbl">De ${fdateL(f.data)} a ${fdateL(u.data)}</div>
        <div class="row" style="gap:28px;margin-top:10px;align-items:flex-end">
          <div><div class="lbl">Peso</div><div class="bigv">${sig(dP)}<span style="font-size:22px"> kg</span></div></div>
          <div><div class="lbl">Gordura</div><div class="bigv" style="color:#C42B7C">${sig(dG)}<span style="font-size:22px"> kg</span></div></div>
          <div><div class="lbl">Massa magra</div><div class="bigv" style="color:#2E8FBF">${sig(dM)}<span style="font-size:22px"> kg</span></div></div></div>
        ${maisGord?`<p style="margin-top:14px;font-size:18px">Você perdeu <b>${fmt(-dG,1)} kg de gordura</b>, mais do que o peso total, porque ganhou massa magra no caminho.</p>`:qual!=null?`<p style="margin-top:14px;font-size:18px">De cada 10 kg que você perdeu, <b>${fmt(qual/10,1)} kg foram de gordura</b>.</p>`:dM!=null&&dM>0?`<p style="margin-top:14px;font-size:18px">Você ganhou <b>${fmt(dM,1)} kg de massa magra</b> no período.</p>`:''}</div>
        <div class="pcard"><div class="lbl">Gordura e massa magra (kg)</div>${lineChart([{data:avs.map(v=>({x:v.data,y:v.gorduraPct!=null?Math.round(v.peso*v.gorduraPct)/100:null})),color:'#C42B7C'},{data:avs.map(v=>({x:v.data,y:v.gorduraPct!=null?Math.round(v.peso*(100-v.gorduraPct))/100:null})),color:'#2E8FBF'}],{light:true,unit:' kg',h:220})}${legend([['#C42B7C','Gordura'],['#2E8FBF','Massa magra']],true)}</div>`;}
  }
  if(PRES.tab==='forca'){
    const nomes=new Set(); D.catalogoTestes.filter(c=>c.tipo==='rm').forEach(c=>nomes.add(c.nome)); D.aulas.filter(a=>a.status==='realizada'&&a.por?.[al.id]).forEach(a=>(a.por[al.id].exs||[]).forEach(x=>nomes.add(x.nome)));
    const g=[...nomes].map(n=>({n,h:historicoForca(al.id,n)})).filter(x=>x.h.length>=2).map(x=>({...x,pct:(x.h[x.h.length-1].y/x.h[0].y-1)*100})).sort((a,b)=>b.pct-a.pct);
    const mx=Math.max(10,...g.map(x=>x.pct));
    body=g.length?`<div class="pcard"><div class="lbl">Força estimada (1RM) desde o primeiro registro</div>${g.map(x=>`<div class="gain"><b>${esc(x.n)}</b><div class="bar"><div style="width:${Math.max(2,x.pct/mx*100)}%;background:${x.pct>=0?'#C42B7C':'#B0AFC8'}"></div></div><b style="font-size:22px;color:${x.pct>=0?'#C42B7C':'#6B6A8C'}">${x.pct>=0?'+':''}${fmt(x.pct,0)}%</b></div>`).join('')}</div>
      <div class="pcard"><div class="lbl">${esc(g[0].n)} · ${fmt(g[0].h[0].y,0)} kg → ${fmt(g[0].h[g[0].h.length-1].y,0)} kg</div>${lineChart([{data:g[0].h,color:'#C42B7C'}],{light:true,unit:' kg',h:220,dec:0})}</div>`

  }
  if(PRES.tab==='testes'){
    const ts=D.testes.filter(t=>t.alunoId===al.id); const rows=D.catalogoTestes.filter(c=>c.tipo!=='rm').map(c=>{const l=ts.filter(t=>t.testeId===c.id).sort((a,b)=>a.data<b.data?-1:1);if(l.length<1)return null;return {c,f:l[0],u:l[l.length-1],n:l.length};}).filter(Boolean);
    body=rows.length?`<div class="pcard">${rows.map(r=>{const d=r.u.valor-r.f.valor;const better=r.c.tipo==='interrupcoes'?d<0:d>0;return `<div class="gain"><b>${esc(r.c.nome)}</b><span class="lbl">${fmt(r.f.valor,0)} → <b style="color:#1C1B3A;font-size:18px">${fmt(r.u.valor,0)}</b> ${TIPO_TESTE[r.c.tipo].u}</span><b style="font-size:20px;color:${r.n<2?'#6B6A8C':better?'#17734F':'#A82828'}">${r.n<2?'1º teste':(d>0?'+':'')+fmt(d,0)}</b></div>`;}).join('')}</div>`:`<div class="pcard"><p class="lbl">Nenhum teste de repetições ou isometria registrado.</p></div>`;

    body=`<div class="pcard"><div class="lbl">Seu objetivo</div><p style="font-size:24px;font-weight:600;margin-top:6px">${esc(o.quer||al.objetivo1||'Ainda não registrado')}</p>${o.parte?`<p class="lbl" style="margin-top:6px">Prioridade: ${esc(o.parte)}</p>`:''}
      ${(o.sinais||[]).length?`<div class="row" style="margin-top:12px">${o.sinais.map(s=>`<span style="background:#ECEBF7;color:#2E2C7A;border-radius:999px;padding:6px 12px;font-weight:600">${esc(s)}</span>`).join('')}</div>`:''}
      ${pp!=null?bar('Meta de peso: '+fmt(al.metaPeso)+' kg',pp,`${fmt(base.peso)} → ${fmt(u.peso)} kg · ${fmt(pp,0)}% do caminho`):''}
      ${pg!=null?bar('Meta de gordura: '+fmt(al.metaGordura)+'%',pg,`${fmt(base.gorduraPct)} → ${fmt(u.gorduraPct)}% · ${fmt(pg,0)}% do caminho`):''}
      ${o.outras?`<p style="margin-top:14px"><b>Outras metas:</b> ${esc(o.outras)}</p>`:''}</div>`;
  }
  if(PRES.tab==='constancia'){
    const meses=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(15);d.setMonth(d.getMonth()-i);meses.push(isoOf(d).slice(0,7));}
    const re=D.aulas.filter(a=>a.alunoIds.includes(al.id)&&a.status==='realizada'); const fa=D.aulas.filter(a=>a.alunoIds.includes(al.id)&&a.status==='falta');

    body=`<div class="pcard"><div class="row" style="gap:28px"><div><div class="lbl">Aulas nos últimos 6 meses</div><div class="bigv">${items.reduce((s,x)=>s+x.v,0)}</div></div><div><div class="lbl">Faltas</div><div class="bigv" style="color:#6B6A8C">${fa.filter(a=>a.data>=meses[0]).length}</div></div></div></div>

function eyeBtn(){return `<button class="btn sm" id="eye" aria-pressed="${!!META.ocultar}" title="${META.ocultar?'Mostrar valores':'Ocultar valores'}">${META.ocultar?'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.1A9.8 9.8 0 0 1 12 5c5 0 9 4.5 10 7-.4 1-1.2 2.3-2.4 3.5M6.6 6.6C4.5 8 3.1 10 2 12c1 2.5 5 7 10 7 1.7 0 3.3-.5 4.6-1.3"/></svg><span class="lbl"> Mostrar valores</span>':'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12c1-2.5 5-7 10-7s9 4.5 10 7c-1 2.5-5 7-10 7S3 14.5 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span class="lbl"> Ocultar valores</span>'}</button>`;}
function wireEye(){const e=$('#eye');if(e)e.onclick=async()=>{META.ocultar=!META.ocultar;await store.set('meta',META);render();};}
function metricasMes(mes){
  const ini=mes+'-01', fimM=isoOf(new Date(+mes.slice(0,4),+mes.slice(5,7),0)), t=today();
  let realV=0,realN=0,fal=0,agV=0,agN=0;
  D.aulas.filter(a=>a.data>=ini&&a.data<=fimM).forEach(a=>{const v=a.valor??valorSessao(a.alvo)??0;if(a.status==='realizada'){realV+=v;realN++;}else if(a.status==='falta'&&a.cobrar){realV+=v;fal++;}});
  if(mes>=monthKey(t)){for(let d=(mes===monthKey(t)?t:ini);d<=fimM;d=addDays(d,1)){sessoesDoDia(d).forEach(s=>{const st=s.aula?.status||'agendada';if(st==='agendada'||st==='andamento'){agN++;agV+=valorSessao(s.alvo)||0;}});}}
  const onl=D.alunos.filter(a=>a.status==='ativo').reduce((s,a)=>s+a.planos.filter(p=>p.tipo==='online'&&p.ativo!==false&&(!p.inicio||p.inicio<=fimM)).reduce((x,p)=>x+(p.mensalidade||0),0),0);
  const rec=Object.values(D.pagamentos[mes]||{}).reduce((s,x)=>s+(x.pagoEm?x.valor:0),0);
  return {realV,realN,fal,agV,agN,onl,proj:realV+agV+onl,rec};
}
function vPainel(app){
  const t=today(), mes=monthKey(t);
  setTop('Painel',`${fdayL(t).replace(/^./,c=>c.toUpperCase())}`,eyeBtn());
  const ativos=D.alunos.filter(a=>a.status==='ativo'); const pers=ativos.filter(isPersonal); const onl=ativos.filter(a=>planoOnline(a));
  const pagantes=ativos.filter(a=>isPersonal(a)||planoOnline(a)); const casais=D.duplas.filter(d=>d.ativo!==false);
  const neg=D.alunos.filter(a=>a.status==='negociacao').length;
  const m=metricasMes(mes);
  const ticket=pagantes.length?m.proj/pagantes.length:null;
  const vs=pers.map(a=>planoPersonal(a).valorSessao).filter(Boolean); const sessMed=vs.length?vs.reduce((s,x)=>s+x,0)/vs.length:null;

function checkField(fe,prev){
  const k=fe.dataset.k; const f=[...BAL,...MED].find(x=>x.k===k)||{k,min:10,max:70,dec:1};

  fe.classList.remove('err','warnf'); fe.querySelector('.msg').textContent='';
  if(v==null)return out;
  if(isNaN(v))out.err='não é um número';
  else{ if((k==='gorduraPct'||k==='musculoPct')&&v>0&&v<1)v=Math.round(v*1000)/10;
    if(v<f.min||v>f.max)out.err=`fora do possível (${f.min}–${f.max} ${f.u||''})`;
    else{out.v=Math.round(v*10)/10;const pv=prev&&prev[k];if(pv!=null){const d=Math.abs(v-pv);if((f.jump&&d/pv>f.jump)||(f.jumpAbs&&d>f.jumpAbs))out.warn=`mudou ${fmt(d,f.dec)} desde a última (${fmt(pv,f.dec)})`;}}}
  if(out.err){fe.classList.add('err');fe.querySelector('.msg').textContent=out.err;} else if(out.warn){fe.classList.add('warnf');fe.querySelector('.msg').textContent=out.warn;}
  return out;
}

function autoText(av,al){
  const avs=avsOf(al.id); const i=avs.findIndex(v=>v.id===av.id); const pv=i>0?avs[i-1]:null; const nm=firstName(al.nome);
  const imc=imcOf(av,al); const ci=clsIMC(imc);
  if(!pv) return `${nm}, esta é a sua primeira avaliação. Ela é o nosso ponto de partida${ci?` — hoje seu IMC está na faixa “${ci[0]}”`:''}. A partir dela vamos acompanhar sua evolução e ajustar os treinos.`;
  const n=days(pv.data,av.data); const parts=[];
  if(av.peso!=null&&pv.peso!=null){const d=av.peso-pv.peso;parts.push(Math.abs(d)<.1?'manteve o peso':`${d<0?'perdeu':'ganhou'} ${fmt(Math.abs(d))} kg`);}
  if(av.gorduraPct!=null&&pv.gorduraPct!=null){const d=av.gorduraPct-pv.gorduraPct;if(Math.abs(d)>=.1)parts.push(`${d<0?'reduziu':'aumentou'} ${fmt(Math.abs(d))} ponto${Math.abs(d)>=2?'s':''} percentua${Math.abs(d)>=2?'is':'l'} de gordura`);}
  if(av.musculoPct!=null&&pv.musculoPct!=null){const d=av.musculoPct-pv.musculoPct;if(Math.abs(d)>=.1)parts.push(`${d>0?'ganhou':'perdeu'} ${fmt(Math.abs(d))} p.p. de músculo`);}
  let s=`${nm}, comparando com a avaliação de ${fdate(pv.data)} (${n} ${n===1?'dia':'dias'} atrás), você ${parts.length>1?parts.slice(0,-1).join(', ')+' e '+parts.slice(-1):parts[0]||'manteve os números estáveis'}.`;
  if(av.cintura!=null&&pv.cintura!=null&&Math.abs(av.cintura-pv.cintura)>=1){const d=av.cintura-pv.cintura;s+=` A cintura ${d<0?'diminuiu':'aumentou'} ${fmt(Math.abs(d),0)} cm.`;}
  if(ci)s+=` Seu IMC está na faixa “${ci[0]}”.`;
  return s;
}
