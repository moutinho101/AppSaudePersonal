  $('#sug').onclick=()=>{const t=$('#concEd');t.value=(t.value.trim()?t.value.trim()+'\n\n':'')+autoText(av,al);t.focus();};
  $('#sv').onclick=async()=>{av.conclusao=$('#concEd').value.trim()||null;await saveAll();toast('Texto salvo');render();};
  const fname=ext=>`Avaliacao_${al.nome.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_')}_${av.data}.${ext}`;
  async function shot(){const pend=$('#concEd').value.trim();if((pend||null)!==(av.conclusao||null)){av.conclusao=pend||null;await saveAll();render();}
    if(!window.html2canvas){toast('Carregando…');await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');}
    const el=$('#rpt');const ne=el.querySelectorAll('[data-noexport]');ne.forEach(x=>x.style.display='none');const pw=el.style.width;el.style.width='420px';el.style.maxWidth='420px';
    const c=await html2canvas(el,{scale:2.5,backgroundColor:'#ffffff',useCORS:true,logging:false});el.style.width=pw;el.style.maxWidth='';ne.forEach(x=>x.style.display='');return c;}
  $('#shImg').onclick=async()=>{try{const c=await shot();const b=await new Promise(r=>c.toBlob(r,'image/png'));await deliver(b,fname('png'),'image/png');}catch(e){toast('Não foi possível gerar a imagem (sem internet?).');}};
  $('#shPdf').onclick=async()=>{try{const c=await shot();if(!window.jspdf)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');const w=420,h=c.height/c.width*w;const pdf=new jspdf.jsPDF({unit:'pt',format:[w,h],orientation:'portrait'});pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,w,h);await deliver(pdf.output('blob'),fname('pdf'),'application/pdf');}catch(e){toast('Não foi possível gerar o PDF (sem internet?).');}};
}

/* ================== FINANCEIRO ================== */
let finMes=null;
function vFinanceiro(app){
  const mes=finMes||monthKey(today()); const ini=mes+'-01'; const fimM=isoOf(new Date(+mes.slice(0,4),+mes.slice(5,7),0));
  const pg=D.pagamentos[mes]||{};
  const linhas={};
  D.aulas.filter(a=>a.data>=ini&&a.data<=fimM&&(a.status==='realizada'||(a.status==='falta'&&a.cobrar))).forEach(a=>{const k=alvoKey(a.alvo);const l=linhas[k]||(linhas[k]={alvo:a.alvo,re:0,fa:0,total:0});const v=a.valor??valorSessao(a.alvo)??0;if(a.status==='realizada')l.re++;else l.fa++;l.total+=v;});
  D.alunos.filter(isPersonal).forEach(a=>{const k='A:'+a.id;if(!linhas[k])linhas[k]={alvo:{tipo:'aluno',id:a.id},re:0,fa:0,total:0};});
  D.duplas.filter(d=>d.ativo!==false).forEach(d=>{const k='D:'+d.id;if(!linhas[k])linhas[k]={alvo:{tipo:'dupla',id:d.id},re:0,fa:0,total:0};});
  const pers=Object.entries(linhas).sort((a,b)=>alvoNome(a[1].alvo).localeCompare(alvoNome(b[1].alvo)));
  const onl=[]; D.alunos.filter(a=>a.status==='ativo').forEach(a=>a.planos.filter(p=>p.tipo==='online'&&p.ativo!==false&&(!p.inicio||p.inicio<=fimM)).forEach(p=>onl.push({a,p})));
  const tP=pers.reduce((s,[,l])=>s+l.total,0), tO=onl.reduce((s,x)=>s+(x.p.mensalidade||0),0);
  const rec=Object.values(pg).reduce((s,x)=>s+(x.pagoEm?x.valor:0),0);
  setTop('Financeiro',monthLabel(mes),eyeBtn());
  const hist=[];for(let i=5;i>=0;i--){const d=new Date(+mes.slice(0,4),+mes.slice(5,7)-1-i,15);const k=isoOf(d).slice(0,7);hist.push({l:d.toLocaleDateString('pt-BR',{month:'short'}).replace('.',''),v:Math.round(Object.values(D.pagamentos[k]||{}).reduce((s,x)=>s+(x.pagoEm?x.valor:0),0))});}
  app.innerHTML=`<div class="stack s20 fade">
    <div class="row between"><div class="row"><button class="btn sm" id="mp">‹</button><b style="font-family:var(--f-display);font-size:20px">${monthLabel(mes).replace(/^./,c=>c.toUpperCase())}</b><button class="btn sm" id="mn">›</button></div><button class="btn sm" id="mh">Mês atual</button></div>
    <div class="kpis">
      <div class="kpi"><div class="eyebrow">Personal</div><div class="v num">${brlH(tP)}</div><div class="d">${pers.reduce((s,[,l])=>s+l.re,0)} aulas realizadas</div></div>
      <div class="kpi"><div class="eyebrow">Consultoria online</div><div class="v num">${brlH(tO)}</div><div class="d">${onl.length} planos</div></div>
      <div class="kpi"><div class="eyebrow">Previsto no mês</div><div class="v num">${brlH(tP+tO)}</div></div>
      <div class="kpi"><div class="eyebrow">Recebido</div><div class="v num" style="color:var(--ok)">${brlH(rec)}</div><div class="d">falta ${brlH(Math.max(0,tP+tO-rec))}</div></div></div>
    <section class="stack s8"><h2>Personal · aulas × valor</h2><p class="small muted">Conta feita pelas aulas finalizadas no modo aula (e faltas marcadas para cobrar).</p>
      <div class="card tbl-wrap"><table class="t"><thead><tr><th>Aluno ou casal</th><th>Aulas</th><th>Faltas cobradas</th><th>Valor da sessão</th><th>Total</th><th>Pago</th></tr></thead><tbody>
      ${pers.map(([k,l])=>{const p=pg[k];return `<tr><td>${esc(alvoNome(l.alvo))}</td><td>${l.re}</td><td>${l.fa||'–'}</td><td>${brlH(valorSessao(l.alvo))}</td><td><b>${brlH(l.total)}</b></td><td><button class="chip ${p?.pagoEm?'ok':'n'}" data-pay="${k}" data-val="${l.total}">${p?.pagoEm?'Pago '+fdate(p.pagoEm):'Marcar pago'}</button></td></tr>`;}).join('')}
      </tbody></table></div></section>
    <section class="stack s8"><h2>Consultoria online</h2>
      ${onl.length?`<div class="card tbl-wrap"><table class="t"><thead><tr><th>Aluno</th><th>Plano</th><th>Pagamento</th><th>Vencimento</th><th>Valor do mês</th><th>Pago</th></tr></thead><tbody>
      ${onl.map(({a,p})=>{const k='P:'+p.id;const x=pg[k];const venc=p.fim?days(today(),p.fim):null;return `<tr><td>${esc(a.nome)}</td><td>${esc(p.periodicidade||'')}</td><td>${esc(p.pagamento||'')}</td><td>${p.fim?`<span class="chip ${venc<0?'bad':venc<=10?'warn':'n'}">${fdate(p.fim)}</span>`:'–'}</td><td><b>${brlH(p.mensalidade)}</b></td><td><button class="chip ${x?.pagoEm?'ok':'n'}" data-pay="${k}" data-val="${p.mensalidade||0}">${x?.pagoEm?'Pago '+fdate(x.pagoEm):'Marcar pago'}</button></td></tr>`;}).join('')}</tbody></table></div>`:'<p class="muted">Nenhum plano online ativo.</p>'}</section>
    <section class="card stack s8"><div class="eyebrow">Recebido nos últimos 6 meses</div>${barChart(hist.map(h=>({l:h.l,v:h.v})),{h:150})}</section>
  </div>`;
  wireEye();
  const mv=n=>{const d=new Date(+mes.slice(0,4),+mes.slice(5,7)-1+n,15);finMes=isoOf(d).slice(0,7);render();};
  $('#mp').onclick=()=>mv(-1); $('#mn').onclick=()=>mv(1); $('#mh').onclick=()=>{finMes=null;render();};
  app.querySelectorAll('[data-pay]').forEach(b=>b.onclick=async()=>{const k=b.dataset.pay;D.pagamentos[mes]=D.pagamentos[mes]||{};const cur=D.pagamentos[mes][k];
    if(cur?.pagoEm){delete D.pagamentos[mes][k];}else D.pagamentos[mes][k]={valor:+b.dataset.val,pagoEm:today()};await saveAll();render();});
}

   <div class="card stack"><h2>Profissional e agenda</h2>

     <div class="field"><label for="p-ha">Meta de horas de aula/semana</label><input id="p-ha" inputmode="numeric" value="${D.config.metaHorasAula}"></div><div class="field"><label for="p-ht">Limite de horas totais/semana</label><input id="p-ht" inputmode="numeric" value="${D.config.metaHorasTotal}"></div>
     <div class="field"><label for="p-du">Duração padrão da aula (min)</label><input id="p-du" inputmode="numeric" value="${D.config.duracaoPadrao}"></div><label class="tg" style="align-self:end"><input type="checkbox" id="p-fc" ${D.config.faltaCobra?'checked':''}> Falta é cobrada por padrão</label>
     <div class="field full"><label for="p-loc">Locais (um por linha)</label><textarea id="p-loc">${esc(D.config.locais.join('\n'))}</textarea></div></div>
     <button class="btn" id="psv">Salvar</button></div>
   <div class="card stack s8"><div class="sec-h"><h2>Casais</h2><button class="btn sm" id="addDupla">+ Casal</button></div><p class="small muted">A aula do casal tem valor próprio e registra os dois alunos no modo aula.</p>
     ${D.duplas.length?`<div class="list">${D.duplas.map(d=>`<button class="li" data-dupla="${d.id}"><span class="li-main"><b>${esc(d.nome)}</b><span>${d.alunoIds.map(id=>esc(alunoById(id)?.nome||'?')).join(' e ')} · ${brl(d.valorSessao)} por aula${d.ativo===false?' · inativo':''}</span></span><span class="muted">›</span></button>`).join('')}</div>`:'<p class="small muted">Nenhum casal.</p>'}</div>
   <div class="card stack s8"><div class="sec-h"><h2>Lista de testes</h2><button class="btn sm" id="addTeste">+ Teste</button></div>
     <div class="list">${D.catalogoTestes.map(c=>`<div class="li" style="cursor:default"><span class="li-main"><b>${esc(c.nome)}</b><span>${TIPO_TESTE[c.tipo].l}</span></span><button class="btn sm ${c.ativo!==false?'':'ghost'}" data-tt="${c.id}">${c.ativo!==false?'Ativo':'Oculto'}</button></div>`).join('')}</div></div>
   <div class="card stack s8"><h2>Exercícios</h2><p class="small muted">${D.exercicios.length} na lista. Novos exercícios criados na aula entram aqui automaticamente.</p></div>
  </div></div>`;
  $('#bkp').onclick=async()=>{if(META.demo){toast('Restaure a base real antes de fazer backup.');return;}
    const out=Object.assign({},D,{app:APPKEY,schema:SCHEMA,exportadoEm:new Date().toISOString()});const ts=new Date();const p=n=>String(n).padStart(2,'0');
    const name=`Backup_SaudePersonal_${ts.getFullYear()}-${p(ts.getMonth()+1)}-${p(ts.getDate())}_${p(ts.getHours())}h${p(ts.getMinutes())}.json`;
    const ok=await deliver(new Blob([JSON.stringify(out)],{type:'application/json'}),name,'application/json');
    if(ok){META.lastBackup=new Date().toISOString();META.changes=0;await store.set('meta',META);toast('Backup gerado');render();}};
  $('#xls').onclick=exportXlsx;
  $('#rst').onclick=()=>$('#fileIn').click();
  $('#psv').onclick=async()=>{Object.assign(D.config,{profissional:$('#p-nome').value.trim(),cref:$('#p-cref').value.trim(),metaHorasAula:parseInt($('#p-ha').value)||22,metaHorasTotal:parseInt($('#p-ht').value)||36,duracaoPadrao:parseInt($('#p-du').value)||60,faltaCobra:$('#p-fc').checked,locais:$('#p-loc').value.split('\n').map(s=>s.trim()).filter(Boolean)});await saveAll();toast('Ajustes salvos');};
  app.querySelectorAll('[data-snap]').forEach(b=>b.onclick=async()=>{const s=await store.get(b.dataset.snap);if(!s)return;if(await confirmSheet({title:'Restaurar cópia local?',body:`Volta a base para ${new Date(s.at).toLocaleString('pt-BR')}. O estado atual vira outra cópia local.`,ok:'Restaurar'})){await snapshot('antes de restaurar cópia local');D=migrate(s.data);await saveAll();toast('Cópia restaurada');go('painel',{},true);}});
  app.querySelectorAll('[data-tt]').forEach(b=>b.onclick=async()=>{const c=D.catalogoTestes.find(x=>x.id===b.dataset.tt);c.ativo=c.ativo===false;await saveAll();render();});
  $('#addTeste').onclick=()=>sheet(`<form class="stack" id="tf"><h2>Novo teste</h2><div class="field"><label for="tn">Nome</label><input id="tn" required></div><div class="field"><label for="tt">Tipo de medida</label><select id="tt">${Object.entries(TIPO_TESTE).map(([k,v])=>`<option value="${k}">${v.l}</option>`).join('')}</select></div><div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-x>Cancelar</button><button class="btn primary">Adicionar</button></div></form>`,(el,close)=>{el.querySelector('[data-x]').onclick=close;el.querySelector('#tf').onsubmit=async e=>{e.preventDefault();D.catalogoTestes.push({id:uid('T'),nome:el.querySelector('#tn').value.trim(),tipo:el.querySelector('#tt').value,ativo:true});await saveAll();close();render();};});
  const duplaSheet=d=>{const ops=D.alunos.filter(a=>a.status!=='inativo'||(d&&d.alunoIds.includes(a.id))).sort((a,b)=>a.nome.localeCompare(b.nome));const sel=(i)=>`<select id="dd${i}">${ops.map(a=>`<option value="${a.id}" ${d&&d.alunoIds[i]===a.id?'selected':''}>${esc(a.nome)}</option>`).join('')}</select>`;
    sheet(`<form class="stack" id="df"><h2>${d?'Editar casal':'Novo casal'}</h2><div class="field"><label for="dn">Nome</label><input id="dn" value="${esc(d?.nome||'')}" required placeholder="Ex.: Caio e Rosa"></div><div class="fgroup"><div class="field"><label>Aluno 1</label>${sel(0)}</div><div class="field"><label>Aluno 2</label>${sel(1)}</div></div><div class="field"><label for="dv">Valor da aula do casal</label><div class="inp"><input id="dv" inputmode="decimal" value="${d?.valorSessao??''}"><span class="u">R$</span></div></div>${d?`<label class="tg"><input type="checkbox" id="da" ${d.ativo!==false?'checked':''}> Ativo</label>`:''}<div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-x>Cancelar</button><button class="btn primary">Salvar</button></div></form>`,(el,close)=>{
      el.querySelector('[data-x]').onclick=close;
      el.querySelector('#df').onsubmit=async e=>{e.preventDefault();const v=parseNum(el.querySelector('#dv').value);const ids=[el.querySelector('#dd0').value,el.querySelector('#dd1').value];if(ids[0]===ids[1]){toast('Escolha dois alunos diferentes');return;}
        const rec={nome:el.querySelector('#dn').value.trim(),alunoIds:ids,valorSessao:isNaN(v)?null:v,ativo:d?el.querySelector('#da').checked:true};if(d)Object.assign(d,rec);else D.duplas.push(Object.assign({id:uid('D')},rec));await saveAll();close();render();};});};
  $('#addDupla').onclick=()=>duplaSheet(null);
  app.querySelectorAll('[data-dupla]').forEach(b=>b.onclick=()=>duplaSheet(D.duplas.find(x=>x.id===b.dataset.dupla)));
}
async function exportXlsx(){try{ if(!window.XLSX){toast('Carregando…');await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');}
  const A=D.alunos.map(a=>({ID:a.id,Aluno:a.nome,Situação:a.status,Sexo:a.sexo,Nascimento:a.nascimento,Idade:idadeEm(a),'Altura (cm)':a.alturaCm,'Objetivo 1':a.objetivo1,'Objetivo 2':a.objetivo2,'Valor sessão':planoPersonal(a)?.valorSessao??null,'Online (mês)':planoOnline(a)?.mensalidade??null,'Plano online':planoOnline(a)?.periodicidade??null,'Vencimento online':planoOnline(a)?.fim??null,Telefone:a.telefone,'E-mail':a.email}));
  const V=D.avaliacoes.slice().sort((a,b)=>a.data<b.data?-1:1).map(v=>{const al=alunoById(v.alunoId)||{};const r={ID:v.id,'ID aluno':v.alunoId,Aluno:al.nome,Data:v.data,'Peso (kg)':v.peso,IMC:imcOf(v,al)?Math.round(imcOf(v,al)*10)/10:null,'Gordura %':v.gorduraPct,'Músculo esq. %':v.musculoPct,'Metab. basal':v.metabolismo,'Idade corporal':v.idadeCorporal,'Visceral (nível)':v.visceral};MED.forEach(m=>r[m.l+' (cm)']=v[m.k]);r['Percepção']=v.conclusao;return r;});
  const AU=[];D.aulas.filter(a=>['realizada','falta'].includes(a.status)).sort((a,b)=>a.data<b.data?-1:1).forEach(a=>a.alunoIds.forEach(id=>{const p=a.por?.[id]||{};AU.push({Data:a.data,Hora:a.hora,Aluno:alunoById(id)?.nome,Tipo:a.alvo.tipo==='dupla'?'casal':'individual',Situação:a.status,Local:a.local,'Duração (min)':a.inicio&&a.fim?Math.round((new Date(a.fim)-new Date(a.inicio))/6e4):null,Esforço:p.pse,Exercícios:(p.exs||[]).map(x=>x.nome+' '+(x.series||[]).map(s=>(s.carga??'')+'x'+(s.reps??'')).join('/')).join('; '),Dores:(p.dores||[]).map(d=>d.local+' '+d.nivel).join('; '),Recado:a.recado,Valor:a.valor});}));
  const T=D.testes.map(t=>{const c=D.catalogoTestes.find(x=>x.id===t.testeId)||{};return {Data:t.data,Aluno:alunoById(t.alunoId)?.nome,Teste:c.nome,Tipo:TIPO_TESTE[c.tipo]?.l,Carga:t.carga,Repetições:t.reps,Resultado:t.valor};});
  const wb=XLSX.utils.book_new();[[A,'Alunos'],[V,'Avaliacoes'],[AU,'Aulas'],[T,'Testes']].forEach(([d,n])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d.length?d:[{}]),n));
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});await deliver(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),`SaudePersonal_${today()}.xlsx`,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}catch(e){toast('Não foi possível gerar a planilha (sem internet?).');}}
$('#fileIn').addEventListener('change',async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f)return;
  let obj; try{obj=JSON.parse(await f.text());}catch(_){toast('Arquivo inválido: não é um backup.');return;}
  if(!obj||obj.app!==APPKEY||!Array.isArray(obj.alunos)||!Array.isArray(obj.avaliacoes)){toast('Este arquivo não é um backup deste app.');return;}
  const lastD=obj.avaliacoes.reduce((m,v)=>v.data>m?v.data:m,'');
  if(await confirmSheet({title:'Restaurar este backup?',body:`<p><b>${esc(f.name)}</b><br>${obj.alunos.length} alunos · ${obj.avaliacoes.length} avaliações · ${(obj.aulas||[]).length} aulas · avaliação mais recente em ${fdate(lastD)}${obj.exportadoEm?` · gerado em ${new Date(obj.exportadoEm).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}`:''}</p><p>Os dados atuais deste aparelho${META.demo?' (de exemplo)':''} serão substituídos.</p>`,ok:'Restaurar'})){
    if(!META.demo)await snapshot('antes de restaurar backup');
    const {app:_a,schema:_s,exportadoEm,...rest}=obj; D=migrate(rest);
    META={lastBackup:exportadoEm||new Date().toISOString(),changes:0,demo:false}; await store.set('db',D); await store.set('meta',META);
    toast('Backup restaurado'); hist.length=0; go('painel',{},true);
  }
});

/* ================== INÍCIO ================== */
(async function boot(){
  buildTabs();
  await store.open();
  try{ if(navigator.storage&&navigator.storage.persist){persisted=await navigator.storage.persisted(); if(!persisted)persisted=await navigator.storage.persist();} }catch(e){}
  D=await store.get('db'); META=Object.assign({lastBackup:null,changes:0,demo:false},await store.get('meta')||{});
  if(!D){D=demoData();META={lastBackup:null,changes:0,demo:true};await store.set('db',D);await store.set('meta',META);}
  else if(!D.schema||D.schema<SCHEMA){await store.set('snap:'+Date.now(),{reason:'antes de atualizar para a versão 2',at:new Date().toISOString(),data:JSON.parse(JSON.stringify(D))});D=migrate(D);await store.set('db',D);}
  render();
})();
